name: 车队卡充电流程(Salvo适配版)
default_timeout: 1200
description: |
  车队卡充电流程。
  payType=3(车队卡), payChannel=1(微信固定), orderSource=0(微信小程序)
  与个人卡/预付流程的主要区别:
    1. payType=3(车队卡) 而非 1(个人卡) 或 2(预付)
    2. 需要查询车队卡列表获取 accountCode/panCode, 并做车队卡预检查获取 carId
    3. 需要生物识别开启检查(JudgeAuth)
    4. 创建订单body额外包含 carId, craneAccountCode, cranePayCode
    5. 不需要查询VIP状态、券包活动、安行充配置
    6. 创建订单和支付后占位订单需要 passWord(与个人卡相同)
    7. 前占位 payType=5(预付), 后占位 payType=1(个人卡, 与个人卡流程相同)
  依赖 SO 插件: login(登录), sign(RSA签名), paypwd(支付密码生成)
  数据来源: CSV上传(用户手机号+充电枪编号), 概率/随机/计算字段由generator节点运行时生成

# =============================================================================
# 场景变量
# =============================================================================
variables:
  # --- 环境 ---
  - key: env_type
    value: "uat1"
  - key: baseurl
    value: "https://uat-manhattan.shell.com.cn"
  - key: gatewayurl
    value: "http://gateway.ev-shell.com.cn"
  - key: simurl
    value: "http://gateway.ev-shell.com.cn"
  # --- 登录 ---
  - key: username
    value: "18936879143"
  - key: password
    value: "Abcd1234!@#$"
  - key: salt_base_url
    value: "${baseurl}/jv/tob-adapter/tob-adapter-application/crm/jv/auth/v1"
  - key: login_base_url
    value: "${baseurl}/jv/tob-adapter/jv/auth/v1"
  # --- 模拟器 ---
  - key: sim_connect_ip
    value: "iot-netty-sever-for-device"
  - key: sim_port
    value: "15051"
  # --- C端 API 路径 ---
  - key: api_get_toc_user_token
    value: "/ev-tools/session/toc-session/get"
  - key: api_get_sign_request
    value: "/ev/toc-adapter/dict/v1/api-config"
  - key: api_query_order
    value: "/ev/toc-adapter/order/v1/query-order-by-status"
  - key: api_pay_order
    value: "/ev/toc-adapter/order/v1/order-pay"
  - key: api_query_occupy_order
    value: "/ev/toc-adapter/order/occupy-order/v1/query-occupy-order-by-status"
  - key: api_pay_occupy_order
    value: "/ev/toc-adapter/order/occupy-order/v1/pay-occupy-order"
  - key: api_start_charging_info
    value: "/ev/toc-adapter/charge/startup-charging/v2/info"
  - key: api_get_user_id
    value: "/ev/toc-adapter/crm/customer/v1/self-info"
  - key: api_fleet_card_list
    value: "/ev/toc-adapter/account/fleet-card/v1/list"
  - key: api_fleet_card_order_check
    value: "/ev/toc-adapter/order/v1/fleet-card-order-check"
  - key: api_judge_auth
    value: "/ev/toc-adapter/crm/auth/v1/judge-authentication"
  - key: api_create_order
    value: "/ev/toc-adapter/order/v1/create-charge-order"
  - key: api_charging_data
    value: "/ev/toc-adapter/charging-process-data/v1/query-by-order-id"
  - key: api_charging_curve
    value: "/ev/toc-adapter/charging-process-data/v1/charge-curve"
  - key: api_stop_charge
    value: "/ev/toc-adapter/order/v1/stop-charge"
  - key: api_order_detail
    value: "/ev/toc-adapter/order/v1/orderDetail"
  - key: api_user_order_coupon
    value: "/ev/toc-adapter/marketing/user-coupon/v1/query-user-order-coupon-list"
  - key: api_get_tag
    value: "/ev/toc-adapter/toc-tag/v1/get-all-star-tag"
  - key: api_save_comment
    value: "/ev/toc-adapter/toc-comment/v1/save-comment"
  - key: api_gen_token
    value: "/common/file-trans/inner/v1/generate-token"
  - key: api_upload_file
    value: "/common/file-trans/outer/v1/upload-file"
  # --- 模拟器 API ---
  - key: sim_cmds
    value: "/iot/simulator/shell/ev/v1/cmds"
  - key: sim_update_point_status
    value: "/iot/simulator/shell/ev/v1/device/update-point-status"
  - key: sim_set_charge_data
    value: "/iot/simulator/shell/ev/v1/charging-process-data-param/set/"
  - key: sim_force_close
    value: "/iot/simulator/shell/ev/v1/force-close/"
  - key: sim_stop_charge_reason
    value: "/iot/simulator/shell/ev/v1/stop-charge-by-stop-reason/"
  # --- 运行时变量 ---
  - key: jwt_token
    value: ""
  - key: token
    value: ""
  - key: rsa_pri_key
    value: ""
  - key: aes_key
    value: ""
  - key: aes_mode
    value: "1"
  - key: sign_apis_json
    value: "[]"
  - key: post_id
    value: "0"
  - key: point_id_int
    value: "0"
  - key: account_id
    value: ""
  - key: tenant_id
    value: ""
  - key: station_id
    value: ""
  - key: user_id
    value: ""
  - key: order_id
    value: ""
  - key: order_id_int
    value: ""
  - key: charging_status
    value: ""
  - key: password_enc
    value: ""
  - key: api_sign
    value: ""
  - key: api_ts
    value: ""
  - key: unpaid_order_id
    value: "0"
  - key: unpaid_order_id_after
    value: "0"
  - key: coupon_id
    value: "0"
  - key: coupon_id_after
    value: "0"
  - key: occupy_order_id
    value: "0"
  - key: charge_start_time_ms
    value: ""
  - key: stop_sent
    value: "false"
  - key: img_path
    value: ""
  - key: comment_tag_id
    value: ""
  - key: comment_star
    value: ""
  # --- 车队卡专用变量 ---
  - key: crane_account_code
    value: ""
  - key: crane_pan_code
    value: ""
  - key: car_id
    value: ""
  # --- 运行时生成字段(generator节点产出) ---
  - key: auto_pay
    value: ""
  - key: force_stop_charge
    value: ""
  - key: charge_post_offline
    value: ""
  - key: raise_error
    value: ""
  - key: force_pay
    value: ""
  - key: pay_channel
    value: ""
  - key: charge_time
    value: ""
  - key: pre_occupy_time
    value: ""
  - key: after_occupy_time
    value: ""
  - key: soc
    value: ""
  - key: pre_pay_amount
    value: ""
  - key: limit_strategy
    value: ""
  - key: limit_value
    value: ""
  - key: charge_post_offline_time
    value: ""
  - key: charge_post_online_time
    value: ""
  - key: raise_error_time
    value: ""

# =============================================================================
# 配置参数
# =============================================================================
config_params:
  # === 硬编码常量(不变) ===
  order_source: "0"             # 订单来源: 0=微信小程序 (WebChatMINI)
  pay_type: "3"                 # 支付方式: 3=车队卡 (FleetCard)
  pay_channel: "1"              # 支付通道: 1=微信 (车队卡固定微信)
  # === 充电数据参数(模拟器) ===
  output_voltage_max: "750"
  output_voltage_min: "200"
  output_current_max: "250"
  output_current_min: "0"
  demand_voltage_max: "750"
  demand_voltage_min: "200"
  demand_current_max: "250"
  demand_current_min: "0"
  # === 占位订单支付参数 ===
  occupy_pay_type_before: "5"   # 前占位支付方式: 5=预付
  occupy_pay_type_after: "1"    # 后占位支付方式: 1=个人卡(与个人卡流程相同)
  occupy_pay_channel: "1"       # 占位支付通道: 1=微信
  # === 故障码停止原因 ===
  stop_reason: "20"             # 故障码: 20=电流异常
  # =================================================================
  # 概率权重配置
  # =================================================================
  auto_pay_prob: "1=50,0=50"                # 自动支付: 50%概率
  force_stop_prob: "1=65,0=35"              # 强制停止充电: 65%概率
  charge_post_offline_prob: "1=95,0=5"      # 强制桩离线: 95%概率
  raise_error_prob: "1=30,0=70"             # 强制故障码: 30%概率
  force_pay_prob: "1=50,0=50"               # 强制支付: 50%概率
  # =================================================================
  # 取值范围配置
  # =================================================================
  charge_time_min: "300"
  charge_time_max: "600"
  pre_occupy_min: "40"
  pre_occupy_max: "60"
  after_occupy_min: "60"
  after_occupy_max: "120"
  soc_min: "95"
  soc_max: "100"
  pre_pay_min: "5"
  pre_pay_max: "999"
  limit_value_amount_ratio: "0.75"

# =============================================================================
# CSV 数据源
# =============================================================================
data_sources:
  - name: user_charger
    columns:
      - phone
      - pointId
      - postId
    rows:
      - phone: "15550000000"
        pointId: "1100000001"
        postId: "11000000"

# =============================================================================
# Setup: 登录 + 获取C端Token
# =============================================================================
setup:
  - name: 登录获取JWT
    type: generator
    block_on_error: true
    config:
      expression: '${__so("login","login","${salt_base_url}","${login_base_url}","${username}","${password}")}'
      variable: jwt_token

  - name: 获取C端Token
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${gatewayurl}${api_get_toc_user_token}"
      headers:
        Content-Type: application/json
      body: '{"envType":"${env_type}","phoneNo":"${user_charger.phone}","expireMinutes":1440}'
      timeout: 10000
      extract:
        token: "$.data.token"
        rsa_pri_key: "$.data.priKey"
        aes_key: "$.data.aesKey"
      expect_body:
        errorCode: 0

# =============================================================================
# 主流程节点
# =============================================================================
nodes:
  # --- 1. 连接模拟器 ---
  - name: 计算postId
    type: generator
    config:
      expression: '${user_charger.postId}'
      variable: post_id

  - name: 计算pointIdInt
    type: generator
    config:
      expression: '${user_charger.pointId}'
      variable: point_id_int

  - name: 连接模拟器
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_cmds}"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 连接模拟器_delay
    type: delay
    config:
      ms: "3000"

  # --- 2. 空闲未插枪 (status=0) ---
  - name: 空闲未插枪
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":0}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 空闲未插枪_delay
    type: delay
    config:
      ms: "3000"

  # --- 3. 空闲已插枪 (status=11) ---
  - name: 空闲已插枪
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":11}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 空闲已插枪_delay
    type: delay
    config:
      ms: "3000"

  # --- 3-2. 获取模拟器 routePath ---
  - name: 获取routePath-setup
    type: http
    config:
      method: POST
      url: "${simurl}/iot/simulator/shell/ev/v1/getRoutePath"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id}}'
      timeout: 10000
      extract:
        route_path: "$.data.routePath"

  # --- 4. 配置充电数据 ---
  - name: 配置充电数据
    type: http
    config:
      method: POST
      url: "${simurl}${sim_set_charge_data}${route_path}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"postId":${post_id},"outputChargingVoltageMax":${output_voltage_max},"outputChargingVoltageMin":${output_voltage_min},"outputChargingCurrentMax":${output_current_max},"outputChargingCurrentMin":${output_current_min},"demandChargingVoltageMax":${demand_voltage_max},"demandChargingVoltageMin":${demand_voltage_min},"demandChargingCurrentMax":${demand_current_max},"demandChargingCurrentMin":${demand_current_min}}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 配置充电数据_delay
    type: delay
    config:
      ms: "1000"

  # --- 5. 概率/随机/计算字段生成器 ---
  - name: 生成-自动支付标志
    type: generator
    config:
      expression: '${__weightedChoice("${auto_pay_prob}")}'
      variable: auto_pay

  - name: 生成-强制停止标志
    type: generator
    config:
      expression: '${__weightedChoice("${force_stop_prob}")}'
      variable: force_stop_charge

  - name: 生成-桩离线标志
    type: generator
    config:
      expression: '${__weightedChoice("${charge_post_offline_prob}")}'
      variable: charge_post_offline

  - name: 生成-故障码标志
    type: generator
    config:
      expression: '${__weightedChoice("${raise_error_prob}")}'
      variable: raise_error

  - name: 生成-强制支付标志
    type: generator
    config:
      expression: '${__weightedChoice("${force_pay_prob}")}'
      variable: force_pay

  # 车队卡 payChannel 固定为 1(微信)
  - name: 生成-支付通道
    type: generator
    config:
      expression: '${pay_channel}'
      variable: pay_channel

  # -- 区间随机字段 --
  - name: 生成-充电时长
    type: generator
    config:
      expression: '${__random(${charge_time_min}, ${charge_time_max})}'
      variable: charge_time

  - name: 生成-前占位时长
    type: generator
    config:
      expression: '${__random(${pre_occupy_min}, ${pre_occupy_max})}'
      variable: pre_occupy_time

  - name: 生成-后占位时长
    type: generator
    config:
      expression: '${__random(${after_occupy_min}, ${after_occupy_max})}'
      variable: after_occupy_time

  - name: 生成-SOC
    type: generator
    config:
      expression: '${__random(${soc_min}, ${soc_max})}'
      variable: soc

  - name: 生成-预付金额
    type: generator
    config:
      expression: '${__random(${pre_pay_min}, ${pre_pay_max})}'
      variable: pre_pay_amount

  - name: 生成-充电策略选择
    type: generator
    config:
      expression: '${__oneOf("0","1","2")}'
      variable: limit_strategy

  # -- 充电策略→限额值分支计算 --
  - name: 判断-充电策略类型
    type: if-else
    config:
      expr: '${limit_strategy} == "0"'

  - name: 计算-充满即停限额值
    type: generator
    config:
      expression: '0'
      variable: limit_value

  - name: 判断-充电策略1或2
    type: if-else
    config:
      expr: '${limit_strategy} == "1"'

  - name: 计算-按金额限制值
    type: generator
    config:
      expression: '${pre_pay_amount} * ${limit_value_amount_ratio}'
      variable: limit_value

  - name: 计算-按SOC限制值
    type: generator
    config:
      expression: '${soc}'
      variable: limit_value

  # -- 时间计算 --
  - name: 计算-桩预计下线时间
    type: generator
    config:
      expression: '${charge_time} * 0.25'
      variable: charge_post_offline_time

  - name: 计算-桩预计上线时间
    type: generator
    config:
      expression: '${charge_time} * 0.35'
      variable: charge_post_online_time

  - name: 计算-故障预计触发时间
    type: generator
    config:
      expression: '${charge_time} * 0.55'
      variable: raise_error_time

  # --- 前占位 (delay) ---
  - name: 前占位
    type: delay
    config:
      ms: "${pre_occupy_time}000"

  # --- 获取签名API列表 ---
  - name: 获取签名API列表
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_get_sign_request}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{}'
      timeout: 10000
      extract:
        sign_apis_json: "$.data.signApiList"
      expect_body:
        errorCode: 0

  # --- 7. 查询待支付订单 ---
  - name: 签名-查询待支付充电订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}'
      variable: sign_result_7
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询待支付订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderClassification":[3]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        unpaid_order_id: "$.data[0].orderId"
      expect_body:
        errorCode: 0

  # --- 8. 支付待支付订单 ---
  - name: 判断-是否有待支付充电订单
    type: if-else
    config:
      expr: '${unpaid_order_id} != "0"'

  - name: 初始化coupon_id
    type: generator
    config:
      expression: '0'
      variable: coupon_id

  - name: 查询待支付订单优惠券
    type: http
    config:
      method: POST
      url: "${baseurl}${api_user_order_coupon}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${unpaid_order_id}"}'
      timeout: 10000
      expect_body:
        errorCode: 0
      extract:
        coupon_id: "$.data.availableUserCoupon[0].instId"

  - name: 判断-是否有可用优惠券
    type: if-else
    config:
      expr: '${coupon_id} != 0'

  - name: 签名-支付待支付订单(含券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id},\"couponId\":\"${coupon_id}\"}")}'
      variable: sign_result_8
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付订单(含券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id},"couponId":"${coupon_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 签名-支付待支付订单(无券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id}}")}'
      variable: sign_result_8b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付订单(无券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 支付待支付订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 9. 查询待支付占位订单 ---
  - name: 签名-查询待支付占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}'
      variable: sign_result_9
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询待支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"occupyOrderStatusList":[2]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        occupy_order_id: "$.data[0].chargeOccupyOrderId"
      expect_body:
        errorCode: 0

  # --- 10. 支付待支付占位订单 (前占位: payType=5, 无密码) ---
  - name: 判断-是否有待支付占位订单
    type: if-else
    config:
      expr: '${occupy_order_id} != "0"'

  - name: 签名-支付待支付占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_before},\"payChannel\":${occupy_pay_channel}}")}'
      variable: sign_result_10
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_before},"payChannel":${occupy_pay_channel}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 支付待支付占位订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 11. 获取AccountID ---
  - name: 签名-获取账户ID
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"pointId\":\"${user_charger.pointId}\"}")}'
      variable: sign_result_11
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取AccountID
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_start_charging_info}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"pointId":"${user_charger.pointId}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        account_id: "$.data.accountInfoRsp.accountId"
        tenant_id: "$.data.tenantId"
        station_id: "$.data.mgrStationRsp.stationId"
      expect_body:
        errorCode: 0

  # --- 12. 获取UserId ---
  - name: 签名-获取用户ID
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_12
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取UserId
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_get_user_id}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        user_id: "$.data.userId"
      expect_body:
        errorCode: 0

  # --- 13. 查询车队卡列表 (车队卡专属) ---
  - name: 签名-查询车队卡列表
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"isCharge\":1,\"stationId\":\"${station_id}\"}")}'
      variable: sign_result_fc1
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询车队卡列表
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_fleet_card_list}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"isCharge":1,"stationId":"${station_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        crane_account_code: "$.data.fleetCardRspList[0].accountCode"
        crane_pan_code: "$.data.fleetCardRspList[0].panCode"
      expect_body:
        errorCode: 0

  # --- 14. 车队卡启动预检查 (车队卡专属) ---
  - name: 签名-车队卡预检查
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"accountCode\":\"${crane_account_code}\",\"amount\":${pre_pay_amount},\"chargingPointId\":\"${user_charger.pointId}\",\"panCode\":\"${crane_pan_code}\"}")}'
      variable: sign_result_fc2
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 车队卡预检查
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_fleet_card_order_check}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"accountCode":"${crane_account_code}","amount":${pre_pay_amount},"chargingPointId":"${user_charger.pointId}","panCode":"${crane_pan_code}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        car_id: "$.data.carId"
      expect_body:
        errorCode: 0

  # --- 15. 生物识别开启检查 (车队卡专属) ---
  - name: 签名-生物识别检查
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_fc3
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 生物识别检查
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_judge_auth}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  # --- 16. 生成支付密码 (车队卡需要密码) ---
  - name: 生成支付密码
    type: generator
    block_on_error: true
    config:
      expression: '${__so("paypwd","gen","${baseurl}","${token}","${aes_key}","${user_id}","123456")}'
      variable: password_enc

  # --- 17. 创建订单 (车队卡: payType=3, 含carId/craneAccountCode/cranePayCode/passWord) ---
  - name: 构造创建订单body
    type: generator
    config:
      expression: '{"chargingPointId":"${user_charger.pointId}","carId":"${car_id}","craneAccountCode":"${crane_account_code}","cranePayCode":"${crane_pan_code}","autoPay":${auto_pay},"orderSource":${order_source},"limitStrategy":${limit_strategy},"limitValue":${limit_value},"prePayAmount":${pre_pay_amount},"payType":${pay_type},"payChannel":${pay_channel},"passWord":"${password_enc}","orderChargeType":1,"soterAuthentication":0}'
      variable: create_order_body

  - name: 签名-创建充电订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","${create_order_body}")}'
      variable: sign_result_17
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 创建订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_create_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '${create_order_body}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0
      extract:
        order_id: "$.data.orderId"
        tenant_id: "$.data.tenantId"

  - name: 创建订单_delay
    type: delay
    config:
      ms: "3000"

  - name: 记录充电开始时间
    type: generator
    config:
      expression: '${__so("sign","now_ms")}'
      variable: charge_start_time_ms

  # --- 18. 轮询充电状态 (30s间隔, status==6退出) ---
  - name: 轮询充电状态
    type: while
    block_on_error: true
    config:
      exit_conditions:
        - variable: charging_status
          operator: equals
          value: "6"
      interval_seconds: 30
      max_iterations: 200
      steps:
        - name: 签名-查询充电状态
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
            variable: sign_result_charge_status
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 查询充电状态
          request:
            method: POST
            url: "${baseurl}${api_charging_data}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"orderId":${order_id}}'
          aes_decrypt: "${aes_key}"
          extract:
            - variable: charging_status
              path: "$.data.chargingStatus"

        - name: 桩离线
          condition:
            variable: charge_post_offline
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${charge_post_offline_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_force_close}${route_path}"
            headers:
              Content-Type: application/json
            body: '{"postId":${post_id}}'

        - name: 桩上线
          condition:
            variable: charge_post_offline
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${charge_post_online_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_cmds}"
            headers:
              Content-Type: application/json
            body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'

        - name: 故障码停止
          condition:
            variable: raise_error
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${raise_error_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_stop_charge_reason}${route_path}"
            headers:
              Content-Type: application/json
            body: '{"pointId":${point_id_int},"postId":${post_id},"stopReason":${stop_reason}}'

        - name: 检查充电时长
          type: generator
          config:
            expression: '${__so("sign","check_charge_time","${charge_start_time_ms}","${charge_time}")}'
            variable: charge_time_reached

        - name: 签名-停止充电
          condition:
            variable: charge_time_reached
            operator: equals
            value: "true"
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
            variable: sign_result_stop
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 停止充电
          condition:
            variable: charge_time_reached
            operator: equals
            value: "true"
          request:
            method: POST
            url: "${baseurl}${api_stop_charge}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"orderId":${order_id}}'
          aes_decrypt: "${aes_key}"
          retry:
            max_attempts: 10
            on_429: retry

  # --- 19. 强制停止充电 ---
  - name: 判断-是否强制停止充电
    type: if-else
    config:
      expr: '${force_stop_charge} == "1"'

  - name: 签名-强制停止充电
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_force_stop
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 强制停止充电
    type: http
    config:
      method: POST
      url: "${baseurl}${api_stop_charge}"
      headers:
        Authorization: "${token}"
        Content-Type: application/json
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
    retry:
      count: 0
      interval: ''

  # --- 20. 查询充电曲线 (5%概率) ---
  - name: 判断-是否查询充电曲线
    type: if-else
    config:
      expr: '${__random(1, 20)} == 1'

  - name: 签名-查询充电曲线
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_20
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询充电曲线
    type: http
    config:
      method: POST
      url: "${baseurl}${api_charging_curve}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  # --- 21. 查询未支付订单(充电后) ---
  - name: 签名-查询未支付充电订单(后)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}'
      variable: sign_result_21
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询未支付订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderClassification":[3]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        unpaid_order_id_after: "$.data[0].orderId"
      expect_body:
        errorCode: 0

  # --- 22. 支付未支付订单(含优惠券) ---
  - name: 判断-是否有未支付充电订单
    type: if-else
    config:
      expr: '${unpaid_order_id_after} != "0"'

  - name: 初始化coupon_id_after
    type: generator
    config:
      expression: '0'
      variable: coupon_id_after

  - name: 查询未付订单优惠券
    type: http
    config:
      method: POST
      url: "${baseurl}${api_user_order_coupon}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${unpaid_order_id_after}"}'
      timeout: 10000
      extract:
        coupon_id_after: "$.data.availableUserCoupon[0].instId"
      expect_body:
        errorCode: 0

  - name: 判断-是否有可用优惠券(后)
    type: if-else
    config:
      expr: '${coupon_id_after} != 0'

  - name: 签名-支付未支付订单(含券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after},\"couponId\":\"${coupon_id_after}\"}")}'
      variable: sign_result_22
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付未支付订单(含券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id_after},"couponId":"${coupon_id_after}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 签名-支付未支付订单(无券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after}}")}'
      variable: sign_result_22b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付未支付订单(无券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id_after}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 支付未支付订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 23. 强制支付 ---
  - name: 判断-是否强制支付
    type: if-else
    config:
      expr: '${force_pay} == "1"'

  - name: 签名-强制支付订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_23
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 强制支付
    type: http
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  # --- 24. 检查订单是否已支付 ---
  - name: 签名-检查订单支付状态
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":\"${order_id}\"}")}'
      variable: sign_result_24
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 检查订单已支付
    type: http
    config:
      method: POST
      url: "${baseurl}${api_order_detail}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":"${order_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        pay_status: "$.data.payStatus"
      expect_body:
        errorCode: 0

  # --- 25. 评论 (条件: payStatus==1) ---
  - name: 判断-订单是否已支付可评论
    type: if-else
    config:
      expr: '${pay_status} == 1'

  - name: 签名-生成文件上传Token
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_25a
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 生成文件上传token
    type: http
    config:
      method: POST
      url: "${gatewayurl}${api_gen_token}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"userId":${user_id},"userType":0,"tenantId":${tenant_id},"accessType":1,"srcService":"toc-charging-application"}'
      timeout: 10000
      extract:
        upload_token: "$.data.token"
      expect_body:
        errorCode: 0

  - name: 上传评论图片
    type: http
    config:
      method: POST
      url: "${gatewayurl}${api_upload_file}"
      headers:
        Authorization: "${token}"
      form:
        token: "${upload_token}"
        file: "asserts/comments.jpg"
      timeout: 10000
      extract:
        img_path: "$.data.filePath"
      expect_body:
        errorCode: 0

  - name: 签名-获取评论标签和星级
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_25b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取评论标签
    type: http
    config:
      method: POST
      url: "${baseurl}${api_get_tag}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      extract:
        comment_star: "$.data[0].star"
        comment_tag_id: "$.data[0].tagVoList[0].tagId"
      expect_body:
        errorCode: 0

  - name: 构造评论body
    type: generator
    config:
      expression: '{"content":"用户:${user_charger.phone}, 订单号:${order_id}","imgList":["${img_path}"],"isAnonymous":0,"orderId":"${order_id}","orderUserId":"${user_id}","sourceType":2,"startLevel":${comment_star},"tagIdList":["${comment_tag_id}"]}'
      variable: comment_body

  - name: 签名-构造评论数据
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","${comment_body}")}'
      variable: sign_result_25c
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 保存评论
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_save_comment}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '${comment_body}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  # --- 26. 后占位 (delay) ---
  - name: 后占位
    type: delay
    config:
      ms: "${after_occupy_time}000"

  # --- 27. 重置枪状态 (空闲未插枪 status=0) ---
  - name: 重置枪状态
    type: http
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":0}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 重置枪状态_delay
    type: delay
    config:
      ms: "3000"

  # --- 28. 轮询占位订单 (30s间隔, 5分钟超时=10次) ---
  - name: 重置占位订单ID
    type: generator
    config:
      expression: '0'
      variable: occupy_order_id

  - name: 轮询占位订单
    type: while
    block_on_error: false
    config:
      exit_conditions:
        - variable: occupy_order_id
          operator: not_equals
          value: "0"
      interval_seconds: 30
      max_iterations: 10
      fail_on_max_iterations: false
      steps:
        - name: 签名-查询占位订单
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}'
            variable: sign_result_occupy
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 查询占位订单
          request:
            method: POST
            url: "${baseurl}${api_query_occupy_order}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"occupyOrderStatusList":[2]}'
          aes_decrypt: "${aes_key}"
          extract:
            - variable: occupy_order_id
              path: "$.data[0].chargeOccupyOrderId"

  # --- 29. 支付占位订单 (后占位: payType=1, 含密码, 与个人卡相同) ---
  - name: 判断-是否有未支付占位订单
    type: if-else
    config:
      expr: '${occupy_order_id} != "0"'

  - name: 签名-支付充电后占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_after},\"payChannel\":${occupy_pay_channel},\"passWord\":\"${password_enc}\"}")}'
      variable: sign_result_29
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_after},"payChannel":${occupy_pay_channel},"passWord":"${password_enc}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"
      expect_body:
        errorCode: 0

  - name: 支付占位订单_delay
    type: delay
    config:
      ms: "3000"

# =============================================================================
# Teardown: 断开模拟器连接
# =============================================================================
teardown:
  - name: 断开模拟器
    type: http
    config:
      method: POST
      url: "${simurl}${sim_force_close}${route_path}"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id}}'
      timeout: 10000
      expect_body:
        errorCode: 0

# =============================================================================
# DAG 边定义
# =============================================================================
edges:
  # Setup → Nodes
  - from: 获取C端Token
    to: 计算postId

  # 模拟器连接 + 状态设置
  - from: 计算postId
    to: 计算pointIdInt
  - from: 计算pointIdInt
    to: 连接模拟器
  - from: 连接模拟器
    to: 连接模拟器_delay
  - from: 连接模拟器_delay
    to: 空闲未插枪
  - from: 空闲未插枪
    to: 空闲未插枪_delay
  - from: 空闲未插枪_delay
    to: 空闲已插枪
  - from: 空闲已插枪
    to: 空闲已插枪_delay
  - from: 空闲已插枪_delay
    to: 获取routePath-setup
  - from: 获取routePath-setup
    to: 配置充电数据
  - from: 配置充电数据
    to: 配置充电数据_delay
  - from: 配置充电数据_delay
    to: 生成-自动支付标志

  # 生成器链路
  - from: 生成-自动支付标志
    to: 生成-强制停止标志
  - from: 生成-强制停止标志
    to: 生成-桩离线标志
  - from: 生成-桩离线标志
    to: 生成-故障码标志
  - from: 生成-故障码标志
    to: 生成-强制支付标志
  - from: 生成-强制支付标志
    to: 生成-支付通道
  - from: 生成-支付通道
    to: 生成-充电时长
  - from: 生成-充电时长
    to: 生成-前占位时长
  - from: 生成-前占位时长
    to: 生成-后占位时长
  - from: 生成-后占位时长
    to: 生成-SOC
  - from: 生成-SOC
    to: 生成-预付金额
  - from: 生成-预付金额
    to: 生成-充电策略选择

  # 充电策略→限额值三分支
  - from: 生成-充电策略选择
    to: 判断-充电策略类型
  - from: 判断-充电策略类型
    to: 计算-充满即停限额值
    condition: "__if_true__"
  - from: 判断-充电策略类型
    to: 判断-充电策略1或2
    condition: "__if_false__"
  - from: 判断-充电策略1或2
    to: 计算-按金额限制值
    condition: "__if_true__"
  - from: 判断-充电策略1或2
    to: 计算-按SOC限制值
    condition: "__if_false__"

  # 三路汇合
  - from: 计算-充满即停限额值
    to: 计算-桩预计下线时间
  - from: 计算-按金额限制值
    to: 计算-桩预计下线时间
  - from: 计算-按SOC限制值
    to: 计算-桩预计下线时间
  - from: 计算-桩预计下线时间
    to: 计算-桩预计上线时间
  - from: 计算-桩预计上线时间
    to: 计算-故障预计触发时间
  - from: 计算-故障预计触发时间
    to: 前占位

  # 前占位 → 签名API列表
  - from: 前占位
    to: 获取签名API列表

  # 查询+支付待支付订单
  - from: 获取签名API列表
    to: 签名-查询待支付充电订单
  - from: 签名-查询待支付充电订单
    to: 查询待支付订单
  - from: 查询待支付订单
    to: 判断-是否有待支付充电订单
  - from: 判断-是否有待支付充电订单
    to: 初始化coupon_id
    condition: "__if_true__"
  - from: 初始化coupon_id
    to: 查询待支付订单优惠券
  - from: 判断-是否有待支付充电订单
    to: 签名-查询待支付占位订单
    condition: "__if_false__"
  - from: 查询待支付订单优惠券
    to: 判断-是否有可用优惠券
  - from: 判断-是否有可用优惠券
    to: 签名-支付待支付订单(含券)
    condition: "__if_true__"
  - from: 签名-支付待支付订单(含券)
    to: 支付待支付订单(含券)
  - from: 支付待支付订单(含券)
    to: 支付待支付订单_delay
  - from: 判断-是否有可用优惠券
    to: 签名-支付待支付订单(无券)
    condition: "__if_false__"
  - from: 签名-支付待支付订单(无券)
    to: 支付待支付订单(无券)
  - from: 支付待支付订单(无券)
    to: 支付待支付订单_delay
  - from: 支付待支付订单_delay
    to: 签名-查询待支付占位订单

  # 查询+支付待支付占位订单
  - from: 签名-查询待支付占位订单
    to: 查询待支付占位订单
  - from: 查询待支付占位订单
    to: 判断-是否有待支付占位订单
  - from: 判断-是否有待支付占位订单
    to: 签名-支付待支付占位订单
    condition: "__if_true__"
  - from: 判断-是否有待支付占位订单
    to: 签名-获取账户ID
    condition: "__if_false__"
  - from: 签名-支付待支付占位订单
    to: 支付待支付占位订单
  - from: 支付待支付占位订单
    to: 支付待支付占位订单_delay
  - from: 支付待支付占位订单_delay
    to: 签名-获取账户ID

  # 获取账户信息
  - from: 签名-获取账户ID
    to: 获取AccountID
  - from: 获取AccountID
    to: 签名-获取用户ID
  - from: 签名-获取用户ID
    to: 获取UserId

  # 车队卡专属流程: UserId → 车队卡列表 → 预检查 → 生物识别 → 密码
  - from: 获取UserId
    to: 签名-查询车队卡列表
  - from: 签名-查询车队卡列表
    to: 查询车队卡列表
  - from: 查询车队卡列表
    to: 签名-车队卡预检查
  - from: 签名-车队卡预检查
    to: 车队卡预检查
  - from: 车队卡预检查
    to: 签名-生物识别检查
  - from: 签名-生物识别检查
    to: 生物识别检查
  - from: 生物识别检查
    to: 生成支付密码

  # 创建订单 (车队卡: 含carId/craneAccountCode/cranePayCode)
  - from: 生成支付密码
    to: 构造创建订单body
  - from: 构造创建订单body
    to: 签名-创建充电订单
  - from: 签名-创建充电订单
    to: 创建订单
  - from: 创建订单
    to: 创建订单_delay
  - from: 创建订单_delay
    to: 记录充电开始时间
  - from: 记录充电开始时间
    to: 轮询充电状态

  # 轮询后 → 强制停止 + 曲线
  - from: 轮询充电状态
    to: 判断-是否强制停止充电
  - from: 判断-是否强制停止充电
