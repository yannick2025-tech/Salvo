  - from: 判断-是否强制停止充电
    to: 判断-是否查询充电曲线
    condition: "__if_false__"
  - from: 强制停止充电
    to: 判断-是否查询充电曲线

  # 充电曲线
  - from: 判断-是否查询充电曲线
