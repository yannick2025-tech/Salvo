name: 个人卡充电流程(Salvo适配版)
description: |
  基于 card.yaml 适配 Salvo DAG 执行模型的个人卡充电流程(TaskType=0, payType=1, payChannel=2)。

  适配要点：
  1. 登录：使用 login SO 插件完成 B端登录(AES-GCM→salt→bcrypt→JWT)，JWT 存入 jwt_token
  2. Token：调用 getTocUserToken 接口获取 C端充电 token(envType=uat1 + phone)，存入 token
  3. 场景变量：baseurl/gatewayurl/toolsurl/simurl/username/password 均为场景变量，可按环境调整
  4. CSV 数据源：单用户(phone=15550000000) + 单充电枪(charger=1100000001)
  5. 充电状态轮询使用 while 节点(支持 exit_conditions/interval_seconds/max_iterations)
  6. 条件分支使用 if-else 节点 + 边条件(__if_true__/__if_false__)
  7. 概率性参数使用 config_params(当前为具体值，可通过 __random/__weightedChoice 改为动态)

# =============================================================================
# 场景变量(环境配置 + 登录凭据 + API路径 + 运行时)
# =============================================================================
variables:
  # --- 环境配置(场景变量，可按环境调整) ---
  - key: env_type
    value: "uat1"
  - key: baseurl
    value: "https://uat-manhattan.shell.com.cn"
  - key: gatewayurl
    value: "http://gateway.ev-shell.com.cn"
  - key: toolsurl
    value: "https://uat-manhattan.shell.com.cn"
  - key: simurl
    value: "http://gateway.ev-shell.com.cn"
  # --- 登录凭据(login SO 插件使用) ---
  - key: username
    value: "18936879143"
  - key: password
    value: "Abcd!@#$1234"
  # --- login 插件 URL(派生自 baseurl) ---
  - key: salt_base_url
    value: "${baseurl}/jv/tob-adapter/tob-adapter-application/crm/jv/auth/v1"
  - key: login_base_url
    value: "${baseurl}/jv/tob-adapter/jv/auth/v1"
  # --- C端 API 路径 ---
  - key: api_get_toc_user_token
    value: "/ev-tools/session/toc-session/get"
  - key: api_get_account_id
    value: "/ev/toc-adapter/crm/customer/v1/self-info"
  - key: api_query_unpaid
    value: "/ev/toc-adapter/order/v1/query-order-by-status"
  - key: api_pay_unpaid
    value: "/ev/toc-adapter/order/v1/order-pay"
  - key: api_create_order
    value: "/ev/toc-adapter/order/v1/create-charge-order"
  - key: api_start_charge
    value: "/ev/toc-adapter/order/v1/start-charge"
  - key: api_charge_status
    value: "/ev/toc-adapter/charging-process-data/v1/query-by-order-id"
  - key: api_charge_curve
    value: "/ev/toc-adapter/charging-process-data/v1/charge-curve"
  - key: api_stop_charge
    value: "/ev/toc-adapter/order/v1/stop-charge"
  - key: api_query_order
    value: "/ev/toc-adapter/order/v1/query-order-by-status"
  - key: api_force_pay
    value: "/ev/toc-adapter/order/v1/order-pay"
  - key: api_get_comment_tag
    value: "/ev/toc-adapter/toc-tag/v1/get-all-star-tag"
  - key: api_save_comment
    value: "/ev/toc-adapter/toc-comment/v1/save-comment"
  - key: api_upload_comment_picture
    value: "/common/file-trans/outer/v1/upload-file"
  # --- 模拟器 API 路径 ---
  - key: sim_connect
    value: "/iot/simulator/shell/ev/v1/cmds"
  - key: sim_set_connector_status
    value: "/iot/simulator/shell/ev/v1/device/update-point-status"
  - key: sim_set_charge_data
    value: "/iot/simulator/shell/ev/v1/charging-process-data-param/set/"
  - key: sim_occupy
    value: "/iot/simulator/shell/ev/v1/occupy"
  - key: sim_generate_order_seq
    value: "/iot/simulator/shell/ev/v1/generate-order-seq"
  - key: sim_reset
    value: "/iot/simulator/shell/ev/v1/reset"
  # --- 运行时变量(初始为空，执行中填充) ---
  - key: jwt_token
    value: ""
  - key: token
    value: ""
  - key: sim_addr
    value: ""
  - key: sim_port
    value: ""
  - key: sim_conn_id
    value: ""
  - key: account_id
    value: ""
  - key: order_id
    value: ""
  - key: start_charge_seq
    value: ""
  - key: charging_status
    value: ""
  - key: unpaid_order_id
    value: ""
  - key: final_unpaid_order_id
    value: ""
  - key: order_status
    value: ""
  - key: comment_id
    value: ""
  - key: comment_picture_path
    value: "/tmp/comment_pic.jpg"

# =============================================================================
# 配置参数(充电业务参数，当前为具体值，可通过表达式改为动态)
# 表达式示例：
#   charge_time: '${__random(60, 600)}'
#   force_stop_charge: '${__weightedChoice("1=35,0=65")}'
#   raise_error_code_val: '${__oneOf("2","3","4","5")}'
# =============================================================================
config_params:
  # 充电时长(秒)
  charge_time: "300"
  # 前/后占位时长(秒)
  pre_occupy_time: "120"
  after_occupy_time: "0"
  # 概率性开关(0=否, 1=是)
  auto_pay: "1"
  force_stop_charge: "0"
  charge_post_offline: "0"
  raise_error_code: "0"
  safe_buy_flag: "0"
  user_vip: "false"
  # 充电数据参数
  min_charge_time: "60"
  min_charge_power: "30"
  max_charge_power: "30000"
  max_charge_power_kw: "30"
  min_soc: "95"
  max_soc: "100"
  single_max_power: "120"
  meter_sample_period: "10"
  raise_error_code_val: "2"
  # 充电时长到达标志(while 内使用)
  charge_time_reached: "false"
  # 桩离线/故障时间(秒，基于 charge_time 计算)
  charge_post_offline_time: "75"
  charge_post_online_time: "150"
  raise_error_time: "150"
  # 评论参数
  comment_star: "50"
  comment_tags: "1,2,3"

# =============================================================================
# CSV 数据源(单用户 + 单充电枪)
# 暂时使用一条数据，后续可扩展为多行 CSV
# 引用格式：${users.phone}、${chargers.charger}
# =============================================================================
data_sources:
  - name: users
    columns:
      - phone
      - cardnum
      - b2b_cardpwd
    rows:
      - phone: "15550000000"
        cardnum: "15550000000"
        b2b_cardpwd: "Abcd!@#$1234"
  - name: chargers
    columns:
      - charger
      - pointId
      - equipNo
      - connectorId
    rows:
      - charger: "1100000001"
        pointId: "1100000001"
        equipNo: "1100000001"
        connectorId: "1"

# =============================================================================
# Setup 阶段：登录 + 获取C端Token
# =============================================================================
setup:
  # S1: 使用 login SO 插件获取 B端 JWT
  # 调用：${__so("login", "login", salt_base_url, login_base_url, username, password)}
  # 插件内部完成：AES-GCM 加密 → 获取salt → 解密 → bcrypt hash → 登录 → 返回JWT
  - name: 登录获取JWT
    type: generator
    config:
      expression: '${__so("login","login","${salt_base_url}","${login_base_url}","${username}","${password}")}'
      variable: jwt_token

  # S2: 调用 getTocUserToken 获取 C端充电 token
  # 需要 envType(uat1) + phone(CSV) + JWT 认证
  - name: 获取C端Token
    type: http
    config:
      method: POST
      url: "${toolsurl}${api_get_toc_user_token}"
      headers:
        Content-Type: application/json
        Authorization: "${jwt_token}"
      body: '{"envType":"${env_type}","phone":"${users.phone}"}'
      timeout: 10000
      extract:
        token: "$.result.token"

# =============================================================================
# 主流程节点
# =============================================================================
nodes:
  # ---------- 1. 连接模拟器 ----------
  - name: 连接模拟器
    type: http
    config:
      method: POST
      url: "${simurl}${sim_connect}"
      headers:
        Content-Type: application/json
      body: '{"equipNo":"${chargers.equipNo}","connectorId":"${chargers.connectorId}"}'
      timeout: 10000
      extract:
        sim_addr: "$.result.simAddr"
        sim_port: "$.result.simPort"
        sim_conn_id: "$.result.simConnId"
    think_time: "1s-3s"

  # ---------- 2. 空闲未插枪 ----------
  - name: 空闲未插枪
    type: http
    config:
      method: POST
      url: "${simurl}${sim_set_connector_status}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}","status":1}'
      timeout: 10000
    think_time: "1s-3s"

  # ---------- 3. 空闲已插枪 ----------
  - name: 空闲已插枪
    type: http
    config:
      method: POST
      url: "${simurl}${sim_set_connector_status}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}","status":2}'
      timeout: 10000
    think_time: "1s-3s"

  # ---------- 4. 配置充电数据 ----------
  - name: 配置充电数据
    type: http
    config:
      method: POST
      url: "${simurl}${sim_set_charge_data}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}","minChargeTime":"${min_charge_time}","minChargePower":"${min_charge_power}","maxChargePower":"${max_charge_power_kw}","minSoc":"${min_soc}","maxSoc":"${max_soc}","singleMaxPower":"${single_max_power}","meterSamplePeriod":"${meter_sample_period}"}'
      timeout: 10000
    think_time: "1s-3s"

  # ---------- 5. 判断前占位 ----------
  - name: 判断前占位
    type: if-else
    config:
      expr: '${pre_occupy_time} > 0'

  # ---------- 6. 前占位(true 分支) ----------
  - name: 前占位
    type: http
    config:
      method: POST
      url: "${simurl}${sim_occupy}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}","occupyTime":"${pre_occupy_time}"}'
      timeout: 10000

  # ---------- 7. 查询待支付订单 ----------
  - name: 查询待支付订单
    type: http
    config:
      method: POST
      url: "${baseurl}${api_query_unpaid}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"cardNum":"${users.cardnum}"}'
      timeout: 10000
      extract:
        unpaid_order_id: "$.result.orderId"

  # ---------- 8. 判断支付待支付 ----------
  - name: 判断支付待支付
    type: if-else
    config:
      expr: '${unpaid_order_id}'

  # ---------- 9. 支付待支付订单(true 分支) ----------
  - name: 支付待支付订单
    type: http
    config:
      method: POST
      url: "${baseurl}${api_pay_unpaid}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${unpaid_order_id}","payType":1,"payChannel":2,"payPwd":"${users.b2b_cardpwd}"}'
      timeout: 10000
    think_time: "1s-3s"

  # ---------- 10. 获取AccountID ----------
  - name: 获取AccountID
    type: http
    config:
      method: GET
      url: "${baseurl}${api_get_account_id}"
      headers:
        Authorization: "${token}"
      timeout: 10000
      extract:
        account_id: "$.result.accountId"

  # ---------- 11. 生成订单号 ----------
  - name: 生成订单号
    type: http
    config:
      method: POST
      url: "${simurl}${sim_generate_order_seq}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}"}'
      timeout: 10000
      extract:
        order_id: "$.result.orderId"
    think_time: "2s-5s"

  # ---------- 12. 创建订单 ----------
  - name: 创建订单
    type: http
    config:
      method: POST
      url: "${baseurl}${api_create_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${order_id}","pointId":"${chargers.pointId}","charger":"${chargers.charger}","cardNum":"${users.cardnum}","payType":1,"payChannel":2,"orderSource":0,"chargeStrategy":0}'
      timeout: 10000
      extract:
        start_charge_seq: "$.result.startChargeSeq"
    think_time: "2s-5s"

  # ---------- 13. 启动充电 ----------
  - name: 启动充电
    type: http
    config:
      method: POST
      url: "${baseurl}${api_start_charge}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"startChargeSeq":"${start_charge_seq}"}'
      timeout: 10000

  # ---------- 14. 轮询充电状态(while 节点) ----------
  - name: 轮询充电状态
    type: while
    config:
      exit_conditions:
        - variable: charging_status
          operator: equals
          value: "4"
      interval_seconds: 30
      max_iterations: 100
      steps:
        # 查询充电状态，提取 status/kwh/money
        - name: 查询充电状态
          request:
            method: POST
            url: "${baseurl}${api_charge_status}"
            headers:
              Content-Type: application/json
              Authorization: "${token}"
            body: '{"startChargeSeq":"${start_charge_seq}"}'
          extract:
            - variable: charging_status
              path: $.result.status
            - variable: charge_kwh
              path: $.result.chargeKwh
            - variable: charge_money
              path: $.result.chargeMoney
        # 充电时长到达后停止(当前 charge_time_reached=false，跳过)
        - name: 充电时长到达后停止
          condition: '${charge_time_reached} == "true"'
          request:
            method: POST
            url: "${baseurl}${api_stop_charge}"
            headers:
              Content-Type: application/json
              Authorization: "${token}"
            body: '{"startChargeSeq":"${start_charge_seq}"}'

  # ---------- 15. 查询充电曲线 ----------
  - name: 查询充电曲线
    type: http
    config:
      method: POST
      url: "${baseurl}${api_charge_curve}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"startChargeSeq":"${start_charge_seq}"}'
      timeout: 10000

  # ---------- 16. 查询未支付订单 ----------
  - name: 查询未支付订单
    type: http
    config:
      method: POST
      url: "${baseurl}${api_query_unpaid}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"cardNum":"${users.cardnum}"}'
      timeout: 10000
      extract:
        final_unpaid_order_id: "$.result.orderId"

  # ---------- 17. 判断支付未付 ----------
  - name: 判断支付未付
    type: if-else
    config:
      expr: '${final_unpaid_order_id}'

  # ---------- 18. 支付未支付订单(true 分支) ----------
  - name: 支付未支付订单
    type: http
    config:
      method: POST
      url: "${baseurl}${api_pay_unpaid}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${final_unpaid_order_id}","payType":1,"payChannel":2,"payPwd":"${users.b2b_cardpwd}"}'
      timeout: 10000

  # ---------- 19. 查询订单状态 ----------
  - name: 查询订单状态
    type: http
    config:
      method: POST
      url: "${baseurl}${api_query_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${order_id}"}'
      timeout: 10000
      extract:
        order_status: "$.result.orderStatus"

  # ---------- 20. 判断强制支付 ----------
  - name: 判断强制支付
    type: if-else
    config:
      expr: '${order_status} != "COMPLETED"'

  # ---------- 21. 强制支付(true 分支) ----------
  - name: 强制支付
    type: http
    config:
      method: POST
      url: "${baseurl}${api_force_pay}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${order_id}","payType":1,"payChannel":2}'
      timeout: 10000

  # ---------- 22. 获取评论标签 ----------
  - name: 获取评论标签
    type: http
    config:
      method: GET
      url: "${baseurl}${api_get_comment_tag}"
      headers:
        Authorization: "${token}"
      timeout: 10000

  # ---------- 23. 上传评论 ----------
  - name: 上传评论
    type: http
    config:
      method: POST
      url: "${baseurl}${api_save_comment}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${order_id}","commentStar":"${comment_star}","tags":"${comment_tags}"}'
      timeout: 10000
      extract:
        comment_id: "$.result.commentId"

  # ---------- 24. 上传评论图片 ----------
  - name: 上传评论图片
    type: http
    config:
      method: POST
      url: "${baseurl}${api_upload_comment_picture}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"commentId":"${comment_id}","pictures":["${comment_picture_path}"]}'
      timeout: 10000

# =============================================================================
# Teardown 阶段：重置充电枪
# =============================================================================
teardown:
  - name: 重置充电枪
    type: http
    config:
      method: POST
      url: "${simurl}${sim_reset}"
      headers:
        Content-Type: application/json
      body: '{"simAddr":"${sim_addr}","simPort":"${sim_port}","simConnId":"${sim_conn_id}"}'
      timeout: 10000

# =============================================================================
# DAG 边定义(含条件分支)
# =============================================================================
edges:
  # Setup 链路
  - from: 登录获取JWT
    to: 获取C端Token
  - from: 获取C端Token
    to: 连接模拟器

  # 模拟器准备
  - from: 连接模拟器
    to: 空闲未插枪
  - from: 空闲未插枪
    to: 空闲已插枪
  - from: 空闲已插枪
    to: 配置充电数据
  - from: 配置充电数据
    to: 判断前占位

  # 前占位条件分支
  - from: 判断前占位
    to: 前占位
    condition: "__if_true__"
  - from: 判断前占位
    to: 查询待支付订单
    condition: "__if_false__"
  - from: 前占位
    to: 查询待支付订单

  # 待支付订单处理
  - from: 查询待支付订单
    to: 判断支付待支付
  - from: 判断支付待支付
    to: 支付待支付订单
    condition: "__if_true__"
  - from: 判断支付待支付
    to: 获取AccountID
    condition: "__if_false__"
  - from: 支付待支付订单
    to: 获取AccountID

  # 订单创建+充电
  - from: 获取AccountID
    to: 生成订单号
  - from: 生成订单号
    to: 创建订单
  - from: 创建订单
    to: 启动充电
  - from: 启动充电
    to: 轮询充电状态
  - from: 轮询充电状态
    to: 查询充电曲线

  # 充电后支付
  - from: 查询充电曲线
    to: 查询未支付订单
  - from: 查询未支付订单
    to: 判断支付未付
  - from: 判断支付未付
    to: 支付未支付订单
    condition: "__if_true__"
  - from: 判断支付未付
    to: 查询订单状态
    condition: "__if_false__"
  - from: 支付未支付订单
    to: 查询订单状态

  # 强制支付条件分支
  - from: 查询订单状态
    to: 判断强制支付
  - from: 判断强制支付
    to: 强制支付
    condition: "__if_true__"
  - from: 判断强制支付
    to: 获取评论标签
    condition: "__if_false__"
  - from: 强制支付
    to: 获取评论标签

  # 评论
  - from: 获取评论标签
    to: 上传评论
  - from: 上传评论
    to: 上传评论图片
  - from: 上传评论图片
    to: 重置充电枪
