name: 个人卡充电流程(Salvo适配版)
default_timeout: 1200
description: |
  个人卡充电流程。
  payType=1(个人卡), payChannel=概率选择(微信70%/支付宝30%), orderSource=0(微信小程序)
  依赖 SO 插件: login(登录), sign(RSA签名), paypwd(支付密码生成)
  数据来源: CSV上传(用户手机号+充电枪编号), 概率/随机/计算字段由generator节点运行时生成
variables:
  - key: account_id
    value: ""
  - key: aes_key
    value: ""
  - key: aes_mode
    value: "1"
  - key: after_occupy_time
    value: ""
  - key: api_charging_curve
    value: /ev/toc-adapter/charging-process-data/v1/charge-curve
  - key: api_charging_data
    value: /ev/toc-adapter/charging-process-data/v1/query-by-order-id
  - key: api_create_order
    value: /ev/toc-adapter/order/v1/create-charge-order
  - key: api_gen_token
    value: /common/file-trans/inner/v1/generate-token
  - key: api_get_sign_request
    value: /ev/toc-adapter/dict/v1/api-config
  - key: api_get_tag
    value: /ev/toc-adapter/toc-tag/v1/get-all-star-tag
  - key: api_get_toc_user_token
    value: /ev-tools/session/toc-session/get
  - key: api_get_user_id
    value: /ev/toc-adapter/crm/customer/v1/self-info
  - key: api_get_vip_info
    value: /ev/toc-adapter/account/v1/get-personal-card-and-vip
  - key: api_order_detail
    value: /ev/toc-adapter/order/v1/orderDetail
  - key: api_pay_occupy_order
    value: /ev/toc-adapter/order/occupy-order/v1/pay-occupy-order
  - key: api_pay_order
    value: /ev/toc-adapter/order/v1/order-pay
  - key: api_query_activity
    value: /ev/toc-adapter/activity/v1/query-activity
  - key: api_query_occupy_order
    value: /ev/toc-adapter/order/occupy-order/v1/query-occupy-order-by-status
  - key: api_query_order
    value: /ev/toc-adapter/order/v1/query-order-by-status
  - key: api_safe_config
    value: /ev/toc-adapter/charge/v1/query-safe-config
  - key: api_save_comment
    value: /ev/toc-adapter/toc-comment/v1/save-comment
  - key: api_sign
    value: ""
  - key: api_start_charging_info
    value: /ev/toc-adapter/charge/startup-charging/v2/info
  - key: api_stop_charge
    value: /ev/toc-adapter/order/v1/stop-charge
  - key: api_ts
    value: ""
  - key: api_upload_file
    value: /common/file-trans/outer/v1/upload-file
  - key: api_user_order_coupon
    value: /ev/toc-adapter/marketing/user-coupon/v1/query-user-order-coupon-list
  - key: auto_pay
    value: ""
  - key: baseurl
    value: https://uat-manhattan.shell.com.cn
  - key: charge_post_offline
    value: ""
  - key: charge_post_offline_time
    value: ""
  - key: charge_post_online_time
    value: ""
  - key: charge_start_time_ms
    value: ""
  - key: charge_time
    value: ""
  - key: charging_status
    value: ""
  - key: comment_star
    value: ""
  - key: comment_tag_id
    value: ""
  - key: coupon_id
    value: "0"
  - key: coupon_id_after
    value: "0"
  - key: env_type
    value: uat1
  - key: force_pay
    value: ""
  - key: force_stop_charge
    value: ""
  - key: gatewayurl
    value: http://gateway.ev-shell.com.cn
  - key: img_path
    value: ""
  - key: jwt_token
    value: ""
  - key: limit_strategy
    value: ""
  - key: limit_value
    value: ""
  - key: login_base_url
    value: ${baseurl}/jv/tob-adapter/jv/auth/v1
  - key: occupy_order_id
    value: "0"
  - key: order_id
    value: ""
  - key: order_id_int
    value: ""
  - key: password
    value: Abcd1234!@#$
  - key: password_enc
    value: ""
  - key: pay_channel
    value: ""
  - key: point_id_int
    value: "0"
  - key: post_id
    value: "0"
  - key: pre_occupy_time
    value: ""
  - key: pre_pay_amount
    value: ""
  - key: raise_error
    value: ""
  - key: raise_error_time
    value: ""
  - key: rsa_pri_key
    value: ""
  - key: salt_base_url
    value: ${baseurl}/jv/tob-adapter/tob-adapter-application/crm/jv/auth/v1
  - key: sell_buy_flag
    value: "0"
  - key: sign_apis_json
    value: '[]'
  - key: sim_cmds
    value: /iot/simulator/shell/ev/v1/cmds
  - key: sim_connect_ip
    value: iot-netty-sever-for-device
  - key: sim_force_close
    value: /iot/simulator/shell/ev/v1/force-close/
  - key: sim_port
    value: "15051"
  - key: sim_set_charge_data
    value: /iot/simulator/shell/ev/v1/charging-process-data-param/set/
  - key: sim_stop_charge_reason
    value: /iot/simulator/shell/ev/v1/stop-charge-by-stop-reason/
  - key: sim_update_point_status
    value: /iot/simulator/shell/ev/v1/device/update-point-status
  - key: simurl
    value: http://gateway.ev-shell.com.cn
  - key: soc
    value: ""
  - key: station_id
    value: ""
  - key: stop_sent
    value: "false"
  - key: tenant_id
    value: ""
  - key: token
    value: ""
  - key: unpaid_order_id
    value: "0"
  - key: unpaid_order_id_after
    value: "0"
  - key: user_id
    value: ""
  - key: user_vip
    value: "0"
  - key: username
    value: "18936879143"
  - key: vip_use
    value: "0"
config_params:
  after_occupy_max: "120"
  after_occupy_min: "60"
  auto_pay_prob: 1=50,0=50
  charge_post_offline_prob: 1=95,0=5
  charge_time_max: "600"
  charge_time_min: "300"
  demand_current_max: "250"
  demand_current_min: "0"
  demand_voltage_max: "750"
  demand_voltage_min: "200"
  force_pay_prob: 1=50,0=50
  force_stop_prob: 1=65,0=35
  limit_value_amount_ratio: "0.75"
  occupy_pay_channel: "1"
  occupy_pay_type_after: "1"
  occupy_pay_type_before: "5"
  order_source: "0"
  output_current_max: "250"
  output_current_min: "0"
  output_voltage_max: "750"
  output_voltage_min: "200"
  pay_channel_prob: 1=70,2=30
  pay_type: "1"
  pre_occupy_max: "60"
  pre_occupy_min: "40"
  pre_pay_max: "999"
  pre_pay_min: "5"
  raise_error_prob: 1=30,0=70
  safe_buy_prob: 1=0,0=100
  soc_max: "100"
  soc_min: "95"
  stop_reason: "20"
  user_vip_prob: 1=0,0=100
data_sources:
  - name: user_charger
    columns:
      - phone
      - pointId
      - postId
    rows:
      - phone: "15550000000"
        pointId: "1100000001"
        postId: "11000000"
setup:
  - name: 登录获取JWT
    type: generator
    config:
      expression: ${__so("login","login","${salt_base_url}","${login_base_url}","${username}","${password}")}
      variable: jwt_token
    block_on_error: true
  - name: 获取C端Token
    type: http
    config:
      body: '{"envType":"${env_type}","phoneNo":"${user_charger.phone}","expireMinutes":1440}'
      expect_body:
        errorCode: 0
      extract:
        aes_key: $.data.aesKey
        rsa_pri_key: $.data.priKey
        token: $.data.token
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${gatewayurl}${api_get_toc_user_token}
    block_on_error: true
nodes:
  - name: 计算postId
    type: generator
    config:
      expression: ${user_charger.postId}
      variable: post_id
  - name: 计算pointIdInt
    type: generator
    config:
      expression: ${user_charger.pointId}
      variable: point_id_int
  - name: 连接模拟器
    type: http
    config:
      body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_cmds}
    block_on_error: true
  - name: 连接模拟器_delay
    type: delay
    config:
      ms: "3000"
  - name: 空闲未插枪
    type: http
    config:
      body: '{"pointId":${point_id_int},"status":0}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_update_point_status}
    block_on_error: true
  - name: 空闲未插枪_delay
    type: delay
    config:
      ms: "3000"
  - name: 空闲已插枪
    type: http
    config:
      body: '{"pointId":${point_id_int},"status":11}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_update_point_status}
    block_on_error: true
  - name: 空闲已插枪_delay
    type: delay
    config:
      ms: "3000"
  - name: 获取routePath-setup
    type: http
    config:
      body: '{"postId":${post_id}}'
      extract:
        route_path: $.data.routePath
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}/iot/simulator/shell/ev/v1/getRoutePath
  - name: 配置充电数据
    type: http
    config:
      body: '{"pointId":${point_id_int},"postId":${post_id},"outputChargingVoltageMax":${output_voltage_max},"outputChargingVoltageMin":${output_voltage_min},"outputChargingCurrentMax":${output_current_max},"outputChargingCurrentMin":${output_current_min},"demandChargingVoltageMax":${demand_voltage_max},"demandChargingVoltageMin":${demand_voltage_min},"demandChargingCurrentMax":${demand_current_max},"demandChargingCurrentMin":${demand_current_min}}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_set_charge_data}${route_path}
  - name: 配置充电数据_delay
    type: delay
    config:
      ms: "1000"
  - name: 生成-自动支付标志
    type: generator
    config:
      expression: ${__weightedChoice("${auto_pay_prob}")}
      variable: auto_pay
  - name: 生成-强制停止标志
    type: generator
    config:
      expression: ${__weightedChoice("${force_stop_prob}")}
      variable: force_stop_charge
  - name: 生成-桩离线标志
    type: generator
    config:
      expression: ${__weightedChoice("${charge_post_offline_prob}")}
      variable: charge_post_offline
  - name: 生成-故障码标志
    type: generator
    config:
      expression: ${__weightedChoice("${raise_error_prob}")}
      variable: raise_error
  - name: 生成-强制支付标志
    type: generator
    config:
      expression: ${__weightedChoice("${force_pay_prob}")}
      variable: force_pay
  - name: 生成-支付通道选择
    type: generator
    config:
      expression: ${__weightedChoice("${pay_channel_prob}")}
      variable: pay_channel
  - name: 生成-VIP用户标志
    type: generator
    config:
      expression: ${__weightedChoice("${user_vip_prob}")}
      variable: user_vip
  - name: 生成-充电时长
    type: generator
    config:
      expression: ${__random(${charge_time_min}, ${charge_time_max})}
      variable: charge_time
  - name: 生成-前占位时长
    type: generator
    config:
      expression: ${__random(${pre_occupy_min}, ${pre_occupy_max})}
      variable: pre_occupy_time
  - name: 生成-后占位时长
    type: generator
    config:
      expression: ${__random(${after_occupy_min}, ${after_occupy_max})}
      variable: after_occupy_time
  - name: 生成-SOC
    type: generator
    config:
      expression: ${__random(${soc_min}, ${soc_max})}
      variable: soc
  - name: 生成-预付金额
    type: generator
    config:
      expression: ${__random(${pre_pay_min}, ${pre_pay_max})}
      variable: pre_pay_amount
  - name: 生成-充电策略选择
    type: generator
    config:
      expression: ${__oneOf("0","1","2")}
      variable: limit_strategy
  - name: 判断-充电策略类型
    type: if-else
    config:
      expr: ${limit_strategy} == "0"
  - name: 计算-充满即停限额值
    type: generator
    config:
      expression: "0"
      variable: limit_value
  - name: 判断-充电策略1或2
    type: if-else
    config:
      expr: ${limit_strategy} == "1"
  - name: 计算-按金额限制值
    type: generator
    config:
      expression: ${pre_pay_amount} * ${limit_value_amount_ratio}
      variable: limit_value
  - name: 计算-按SOC限制值
    type: generator
    config:
      expression: ${soc}
      variable: limit_value
  - name: 计算-桩预计下线时间
    type: generator
    config:
      expression: ${charge_time} * 0.25
      variable: charge_post_offline_time
  - name: 计算-桩预计上线时间
    type: generator
    config:
      expression: ${charge_time} * 0.35
      variable: charge_post_online_time
  - name: 计算-故障预计触发时间
    type: generator
    config:
      expression: ${charge_time} * 0.55
      variable: raise_error_time
  - name: 前占位
    type: delay
    config:
      ms: ${pre_occupy_time}000
  - name: 获取签名API列表
    type: http
    config:
      body: '{}'
      expect_body:
        errorCode: 0
      extract:
        sign_apis_json: $.data.signApiList
      headers:
        Authorization: ${token}
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${baseurl}${api_get_sign_request}
    block_on_error: true
  - name: 签名-查询待支付充电订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_7
  - name: 查询待支付订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderClassification":[3]}'
      expect_body:
        errorCode: 0
      extract:
        unpaid_order_id: $.data[0].orderId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_query_order}
    block_on_error: true
  - name: 判断-是否有待支付充电订单
    type: if-else
    config:
      expr: ${unpaid_order_id} != "0"
  - name: 初始化coupon_id
    type: generator
    config:
      expression: "0"
      variable: coupon_id
  - name: 查询待支付订单优惠券
    type: http
    config:
      body: '{"orderId":"${unpaid_order_id}"}'
      expect_body:
        errorCode: 0
      extract:
        coupon_id: $.data.availableUserCoupon[0].instId
      headers:
        Authorization: ${token}
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${baseurl}${api_user_order_coupon}
  - name: 判断-是否有可用优惠券
    type: if-else
    config:
      expr: ${coupon_id} != 0
  - name: 签名-支付待支付订单(含券)
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id},\"couponId\":\"${coupon_id}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_8
  - name: 支付待支付订单(含券)
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${unpaid_order_id},"couponId":"${coupon_id}"}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_order}
    block_on_error: true
  - name: 签名-支付待支付订单(无券)
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_8b
  - name: 支付待支付订单(无券)
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${unpaid_order_id}}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_order}
    block_on_error: true
  - name: 支付待支付订单_delay
    type: delay
    config:
      ms: "3000"
  - name: 签名-查询待支付占位订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_9
  - name: 查询待支付占位订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"occupyOrderStatusList":[2]}'
      expect_body:
        errorCode: 0
      extract:
        occupy_order_id: $.data[0].chargeOccupyOrderId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_query_occupy_order}
    block_on_error: true
  - name: 判断-是否有待支付占位订单
    type: if-else
    config:
      expr: ${occupy_order_id} != "0"
  - name: 签名-支付待支付占位订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_before},\"payChannel\":${occupy_pay_channel}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_10
  - name: 支付待支付占位订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_before},"payChannel":${occupy_pay_channel}}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_occupy_order}
    block_on_error: true
  - name: 支付待支付占位订单_delay
    type: delay
    config:
      ms: "3000"
  - name: 签名-获取账户ID
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"pointId\":\"${user_charger.pointId}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_11
  - name: 获取AccountID
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"pointId":"${user_charger.pointId}"}'
      expect_body:
        errorCode: 0
      extract:
        account_id: $.data.accountInfoRsp.accountId
        station_id: $.data.mgrStationRsp.stationId
        tenant_id: $.data.tenantId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_start_charging_info}
    block_on_error: true
  - name: 签名-获取用户ID
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_12
  - name: 获取UserId
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{}'
      expect_body:
        errorCode: 0
      extract:
        user_id: $.data.userId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_get_user_id}
    block_on_error: true
  - name: 签名-获取VIP状态
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"accountId\":\"${account_id}\",\"tenantId\":\"${tenant_id}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_13
  - name: 获取VIP状态
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"accountId":"${account_id}","tenantId":"${tenant_id}"}'
      expect_body:
        errorCode: 0
      extract:
        today_left_count: $.data.userVipDetailRspVO.userVipPackageCycleInfo.toDayLeftCount
        vip_status: $.data.userVipDetailRspVO.userVipStatus
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_get_vip_info}
  - name: 计算VIP使用标志
    type: generator
    config:
      expression: ${__weightedChoice("${user_vip_prob}")}
      variable: vip_use
  - name: 签名-查询券包活动
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"pointId\":\"${user_charger.pointId}\",\"activityNeed\":[3]}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_14
  - name: 查询券包活动
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"pointId":"${user_charger.pointId}","activityNeed":[3]}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_query_activity}
  - name: 签名-查询安行充配置
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"stationId\":\"${station_id}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_15
  - name: 查询安行充
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"stationId":"${station_id}"}'
      expect_body:
        errorCode: 0
      extract:
        sell_flag: $.data.sellFlag
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_safe_config}
  - name: 计算安行充标志
    type: generator
    config:
      expression: ${__weightedChoice("${safe_buy_prob}")}
      variable: sell_buy_flag
  - name: 生成支付密码
    type: generator
    config:
      expression: ${__so("paypwd","gen","${baseurl}","${token}","${aes_key}","${user_id}","123456")}
      variable: password_enc
    block_on_error: true
  - name: 构造创建订单body
    type: generator
    config:
      expression: '{"chargingPointId":"${user_charger.pointId}","autoPay":${auto_pay},"orderSource":${order_source},"limitStrategy":${limit_strategy},"limitValue":${limit_value},"soc":${soc},"prePayAmount":${pre_pay_amount},"payType":${pay_type},"payChannel":${pay_channel},"passWord":"${password_enc}","orderChargeType":1,"useVipInterest":${vip_use},"safeBuyFlag":${sell_buy_flag}}'
      variable: create_order_body
  - name: 签名-创建充电订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","${create_order_body}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_17
  - name: 创建订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: ${create_order_body}
      expect_body:
        errorCode: 0
      extract:
        order_id: $.data.orderId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_create_order}
    block_on_error: true
  - name: 创建订单_delay
    type: delay
    config:
      ms: "3000"
  - name: 记录充电开始时间
    type: generator
    config:
      expression: ${__so("sign","now_ms")}
      variable: charge_start_time_ms
  - name: 轮询充电状态
    type: while
    config:
      exit_conditions:
        - operator: equals
          value: "6"
          variable: charging_status
      interval_seconds: 30
      max_iterations: 200
      steps:
        - config:
            expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}
            extract:
              api_sign: $.sign
              api_ts: $.ts
            variable: sign_result_charge_status
          name: 签名-查询充电状态
          type: generator
        - aes_decrypt: ${aes_key}
          extract:
            - path: $.data.chargingStatus
              variable: charging_status
          name: 查询充电状态
          request:
            body: '{"orderId":${order_id}}'
            headers:
              Authorization: ${token}
              Content-Type: application/json
              x-ev-api-sign: ${api_sign}
              x-ev-api-timestamp: ${api_ts}
            method: POST
            url: ${baseurl}${api_charging_data}
        - condition:
            operator: equals
            value: "1"
            variable: charge_post_offline
          name: 桩离线
          request:
            body: '{"postId":${post_id}}'
            headers:
              Content-Type: application/json
            method: POST
            url: ${simurl}${sim_force_close}${route_path}
          timed_trigger:
            after_seconds: ${charge_post_offline_time}
            once: true
        - condition:
            operator: equals
            value: "1"
            variable: charge_post_offline
          name: 桩上线
          request:
            body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'
            headers:
              Content-Type: application/json
            method: POST
            url: ${simurl}${sim_cmds}
          timed_trigger:
            after_seconds: ${charge_post_online_time}
            once: true
        - condition:
            operator: equals
            value: "1"
            variable: raise_error
          name: 故障码停止
          request:
            body: '{"pointId":${point_id_int},"postId":${post_id},"stopReason":${stop_reason}}'
            headers:
              Content-Type: application/json
            method: POST
            url: ${simurl}${sim_stop_charge_reason}${route_path}
          timed_trigger:
            after_seconds: ${raise_error_time}
            once: true
        - config:
            expression: ${__so("sign","check_charge_time","${charge_start_time_ms}","${charge_time}")}
            variable: charge_time_reached
          name: 检查充电时长
          type: generator
        - condition:
            operator: equals
            value: "true"
            variable: charge_time_reached
          config:
            expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}
            extract:
              api_sign: $.sign
              api_ts: $.ts
            variable: sign_result_stop
          name: 签名-停止充电
          type: generator
        - aes_decrypt: ${aes_key}
          condition:
            operator: equals
            value: "true"
            variable: charge_time_reached
          name: 停止充电
          request:
            body: '{"orderId":${order_id}}'
            headers:
              Authorization: ${token}
              Content-Type: application/json
              x-ev-api-sign: ${api_sign}
              x-ev-api-timestamp: ${api_ts}
            method: POST
            url: ${baseurl}${api_stop_charge}
          retry:
            max_attempts: 10
            on_429: retry
    block_on_error: true
  - name: 判断-是否强制停止充电
    type: if-else
    config:
      expr: ${force_stop_charge} == "1"
  - name: 签名-强制停止充电
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_force_stop
  - name: 强制停止充电
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${order_id}}'
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_stop_charge}
    retry:
      count: 0
      interval: ""
  - name: 判断-是否查询充电曲线
    type: if-else
    config:
      expr: ${__random(1, 20)} == 1
  - name: 签名-查询充电曲线
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_20
  - name: 查询充电曲线
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${order_id}}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_charging_curve}
  - name: 签名-查询未支付充电订单(后)
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_21
  - name: 查询未支付订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderClassification":[3]}'
      expect_body:
        errorCode: 0
      extract:
        unpaid_order_id_after: $.data[0].orderId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_query_order}
    block_on_error: true
  - name: 判断-是否有未支付充电订单
    type: if-else
    config:
      expr: ${unpaid_order_id_after} != "0"
  - name: 初始化coupon_id_after
    type: generator
    config:
      expression: "0"
      variable: coupon_id_after
  - name: 查询未付订单优惠券
    type: http
    config:
      body: '{"orderId":"${unpaid_order_id_after}"}'
      expect_body:
        errorCode: 0
      extract:
        coupon_id_after: $.data.availableUserCoupon[0].instId
      headers:
        Authorization: ${token}
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${baseurl}${api_user_order_coupon}
  - name: 判断-是否有可用优惠券(后)
    type: if-else
    config:
      expr: ${coupon_id_after} != 0
  - name: 签名-支付未支付订单(含券)
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after},\"couponId\":\"${coupon_id_after}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_22
  - name: 支付未支付订单(含券)
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${unpaid_order_id_after},"couponId":"${coupon_id_after}"}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_order}
    block_on_error: true
  - name: 签名-支付未支付订单(无券)
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_22b
  - name: 支付未支付订单(无券)
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${unpaid_order_id_after}}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_order}
    block_on_error: true
  - name: 支付未支付订单_delay
    type: delay
    config:
      ms: "3000"
  - name: 判断-是否强制支付
    type: if-else
    config:
      expr: ${force_pay} == "1"
  - name: 签名-强制支付订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_23
  - name: 强制支付
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":${order_id}}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_order}
  - name: 签名-检查订单支付状态
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"orderId\":\"${order_id}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_24
  - name: 检查订单已支付
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"orderId":"${order_id}"}'
      expect_body:
        errorCode: 0
      extract:
        pay_status: $.data.payStatus
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_order_detail}
  - name: 判断-订单是否已支付可评论
    type: if-else
    config:
      expr: ${pay_status} == 1
  - name: 签名-生成文件上传Token
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_25a
  - name: 生成文件上传token
    type: http
    config:
      body: '{"userId":${user_id},"userType":0,"tenantId":${tenant_id},"accessType":1,"srcService":"toc-charging-application"}'
      expect_body:
        errorCode: 0
      extract:
        upload_token: $.data.token
      headers:
        Authorization: ${token}
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${gatewayurl}${api_gen_token}
  - name: 上传评论图片
    type: http
    config:
      expect_body:
        errorCode: 0
      extract:
        img_path: $.data.filePath
      form:
        file: asserts/comments.jpg
        token: ${upload_token}
      headers:
        Authorization: ${token}
      method: POST
      timeout: 10000
      url: ${gatewayurl}${api_upload_file}
  - name: 签名-获取评论标签和星级
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_25b
  - name: 获取评论标签
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{}'
      expect_body:
        errorCode: 0
      extract:
        comment_star: $.data[0].star
        comment_tag_id: $.data[0].tagVoList[0].tagId
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_get_tag}
  - name: 构造评论body
    type: generator
    config:
      expression: '{"content":"用户:${user_charger.phone}, 订单号:${order_id}","imgList":["${img_path}"],"isAnonymous":0,"orderId":"${order_id}","orderUserId":"${user_id}","sourceType":2,"startLevel":${comment_star},"tagIdList":["${comment_tag_id}"]}'
      variable: comment_body
  - name: 签名-构造评论数据
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","${comment_body}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_25c
  - name: 保存评论
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: ${comment_body}
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_save_comment}
    block_on_error: true
  - name: 后占位
    type: delay
    config:
      ms: ${after_occupy_time}000
  - name: 重置枪状态
    type: http
    config:
      body: '{"pointId":${point_id_int},"status":0}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_update_point_status}
  - name: 重置枪状态_delay
    type: delay
    config:
      ms: "3000"
  - name: 重置占位订单ID
    type: generator
    config:
      expression: "0"
      variable: occupy_order_id
  - name: 轮询占位订单
    type: while
    config:
      exit_conditions:
        - operator: not_equals
          value: "0"
          variable: occupy_order_id
      interval_seconds: 30
      max_iterations: 10
      steps:
        - config:
            expression: ${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}
            extract:
              api_sign: $.sign
              api_ts: $.ts
            variable: sign_result_occupy
          name: 签名-查询占位订单
          type: generator
        - aes_decrypt: ${aes_key}
          extract:
            - path: $.data[0].chargeOccupyOrderId
              variable: occupy_order_id
          name: 查询占位订单
          request:
            body: '{"occupyOrderStatusList":[2]}'
            headers:
              Authorization: ${token}
              Content-Type: application/json
              x-ev-api-sign: ${api_sign}
              x-ev-api-timestamp: ${api_ts}
            method: POST
            url: ${baseurl}${api_query_occupy_order}
  - name: 判断-是否有未支付占位订单
    type: if-else
    config:
      expr: ${occupy_order_id} != "0"
  - name: 签名-支付充电后占位订单
    type: generator
    config:
      expression: ${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_after},\"payChannel\":${occupy_pay_channel},\"passWord\":\"${password_enc}\"}")}
      extract:
        api_sign: $.sign
        api_ts: $.ts
      variable: sign_result_29
  - name: 支付占位订单
    type: http
    config:
      aes_decrypt: ${aes_key}
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_after},"payChannel":${occupy_pay_channel},"passWord":"${password_enc}"}'
      expect_body:
        errorCode: 0
      headers:
        Authorization: ${token}
        Content-Type: application/json
        x-ev-api-sign: ${api_sign}
        x-ev-api-timestamp: ${api_ts}
      method: POST
      timeout: 10000
      url: ${baseurl}${api_pay_occupy_order}
    block_on_error: true
  - name: 支付占位订单_delay
    type: delay
    config:
      ms: "3000"
teardown:
  - name: 断开模拟器
    type: http
    config:
      body: '{"postId":${post_id}}'
      expect_body:
        errorCode: 0
      headers:
        Content-Type: application/json
      method: POST
      timeout: 10000
      url: ${simurl}${sim_force_close}${route_path}
edges:
  - from: 获取C端Token
    to: 计算postId
  - from: 计算postId
    to: 计算pointIdInt
  - from: 计算pointIdInt
    to: 连接模拟器
  - from: 连接模拟器
    to: 连接模拟器_delay
  - from: 连接模拟器_delay
    to: 空闲未插枪
  - from: 空闲未插枪
    to: 空闲未插枪_delay
  - from: 空闲未插枪_delay
    to: 空闲已插枪
  - from: 空闲已插枪
    to: 空闲已插枪_delay
  - from: 空闲已插枪_delay
    to: 获取routePath-setup
  - from: 获取routePath-setup
    to: 配置充电数据
  - from: 配置充电数据
    to: 配置充电数据_delay
  - from: 配置充电数据_delay
    to: 生成-自动支付标志
  - from: 生成-自动支付标志
    to: 生成-强制停止标志
  - from: 生成-强制停止标志
    to: 生成-桩离线标志
  - from: 生成-桩离线标志
    to: 生成-故障码标志
  - from: 生成-故障码标志
    to: 生成-强制支付标志
  - from: 生成-强制支付标志
    to: 生成-支付通道选择
  - from: 生成-支付通道选择
    to: 生成-VIP用户标志
  - from: 生成-VIP用户标志
    to: 生成-充电时长
  - from: 生成-充电时长
    to: 生成-前占位时长
  - from: 生成-前占位时长
    to: 生成-后占位时长
  - from: 生成-后占位时长
    to: 生成-SOC
  - from: 生成-SOC
    to: 生成-预付金额
  - from: 生成-预付金额
    to: 生成-充电策略选择
  - from: 生成-充电策略选择
    to: 判断-充电策略类型
  - from: 判断-充电策略类型
    to: 计算-充满即停限额值
    condition: __if_true__
  - from: 判断-充电策略类型
    to: 判断-充电策略1或2
    condition: __if_false__
  - from: 判断-充电策略1或2
    to: 计算-按金额限制值
    condition: __if_true__
  - from: 判断-充电策略1或2
