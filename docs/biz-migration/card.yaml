name: 个人卡充电流程(Salvo适配版)
default_timeout: 1200
description: |
  个人卡充电流程。
  payType=1(个人卡), payChannel=概率选择(微信70%/支付宝30%), orderSource=0(微信小程序)
  依赖 SO 插件: login(登录), sign(RSA签名), paypwd(支付密码生成)
  数据来源: CSV上传(用户手机号+充电枪编号), 概率/随机/计算字段由generator节点运行时生成

# =============================================================================
# 场景变量
# =============================================================================
variables:
  # --- 环境 ---
  - key: env_type
    value: "uat1"
  - key: baseurl
    value: "https://uat-manhattan.shell.com.cn"
  - key: gatewayurl
    value: "http://gateway.ev-shell.com.cn"
  - key: simurl
    value: "http://gateway.ev-shell.com.cn"
  # --- 登录 ---
  - key: username
    value: "18936879143"
  - key: password
    value: "Abcd1234!@#$"
  - key: salt_base_url
    value: "${baseurl}/jv/tob-adapter/tob-adapter-application/crm/jv/auth/v1"
  - key: login_base_url
    value: "${baseurl}/jv/tob-adapter/jv/auth/v1"
  # --- 模拟器 ---
  - key: sim_connect_ip
    value: "iot-netty-sever-for-device"
  - key: sim_port
    value: "15051"
  # --- C端 API 路径 ---
  - key: api_get_toc_user_token
    value: "/ev-tools/session/toc-session/get"
  - key: api_get_sign_request
    value: "/ev/toc-adapter/dict/v1/api-config"
  - key: api_query_order
    value: "/ev/toc-adapter/order/v1/query-order-by-status"
  - key: api_pay_order
    value: "/ev/toc-adapter/order/v1/order-pay"
  - key: api_query_occupy_order
    value: "/ev/toc-adapter/order/occupy-order/v1/query-occupy-order-by-status"
  - key: api_pay_occupy_order
    value: "/ev/toc-adapter/order/occupy-order/v1/pay-occupy-order"
  - key: api_start_charging_info
    value: "/ev/toc-adapter/charge/startup-charging/v2/info"
  - key: api_get_user_id
    value: "/ev/toc-adapter/crm/customer/v1/self-info"
  - key: api_get_vip_info
    value: "/ev/toc-adapter/account/v1/get-personal-card-and-vip"
  - key: api_query_activity
    value: "/ev/toc-adapter/activity/v1/query-activity"
  - key: api_safe_config
    value: "/ev/toc-adapter/charge/v1/query-safe-config"
  - key: api_create_order
    value: "/ev/toc-adapter/order/v1/create-charge-order"
  - key: api_charging_data
    value: "/ev/toc-adapter/charging-process-data/v1/query-by-order-id"
  - key: api_charging_curve
    value: "/ev/toc-adapter/charging-process-data/v1/charge-curve"
  - key: api_stop_charge
    value: "/ev/toc-adapter/order/v1/stop-charge"
  - key: api_order_detail
    value: "/ev/toc-adapter/order/v1/orderDetail"
  - key: api_user_order_coupon
    value: "/ev/toc-adapter/marketing/user-coupon/v1/query-user-order-coupon-list"
  - key: api_get_tag
    value: "/ev/toc-adapter/toc-tag/v1/get-all-star-tag"
  - key: api_save_comment
    value: "/ev/toc-adapter/toc-comment/v1/save-comment"
  - key: api_gen_token
    value: "/common/file-trans/inner/v1/generate-token"
  - key: api_upload_file
    value: "/common/file-trans/outer/v1/upload-file"
  # --- 模拟器 API ---
  - key: sim_cmds
    value: "/iot/simulator/shell/ev/v1/cmds"
  - key: sim_update_point_status
    value: "/iot/simulator/shell/ev/v1/device/update-point-status"
  - key: sim_set_charge_data
    value: "/iot/simulator/shell/ev/v1/charging-process-data-param/set/"
  - key: sim_force_close
    value: "/iot/simulator/shell/ev/v1/force-close/"
  - key: sim_stop_charge_reason
    value: "/iot/simulator/shell/ev/v1/stop-charge-by-stop-reason/"
  # --- 运行时变量 ---
  - key: jwt_token
    value: ""
  - key: token
    value: ""
  - key: rsa_pri_key
    value: ""
  - key: aes_key
    value: ""
  # AES 加密模式：1=GCM（默认，Manhattan UAT 当前使用），0=CBC（老版本，仅特殊节点需要时显式设为 0）
  - key: aes_mode
    value: "1"
  - key: sign_apis_json
    value: "[]"
  - key: post_id
    value: "0"
  - key: point_id_int
    value: "0"
  - key: account_id
    value: ""
  - key: tenant_id
    value: ""
  - key: station_id
    value: ""
  - key: user_id
    value: ""
  - key: order_id
    value: ""
  - key: order_id_int
    value: ""
  - key: charging_status
    value: ""
  - key: password_enc
    value: ""
  - key: vip_use
    value: "0"
  - key: sell_buy_flag
    value: "0"
  - key: api_sign
    value: ""
  - key: api_ts
    value: ""
  # 待支付订单ID：整数字段，默认值必须是 "0" 而非 ""
  # 原因：body 模板 {"orderId":${unpaid_order_id}} 需要有效 JSON
  # 如果默认 ""，替换后变成 {"orderId":} 导致 JSON 解析失败
  - key: unpaid_order_id
    value: "0"
  # 待支付占位订单ID：整数字段，默认值必须是 "0"
  - key: unpaid_order_id_after
    value: "0"
  - key: coupon_id
    value: "0"
  - key: coupon_id_after
    value: "0"
  - key: occupy_order_id
    value: "0"
  - key: charge_start_time_ms
    value: ""
  - key: stop_sent
    value: "false"
  - key: img_path
    value: ""
  - key: comment_tag_id
    value: ""
  - key: comment_star
    value: ""
  # --- 运行时生成字段(generator节点产出) ---
  - key: auto_pay
    value: ""
  - key: force_stop_charge
    value: ""
  - key: charge_post_offline
    value: ""
  - key: raise_error
    value: ""
  - key: force_pay
    value: ""
  - key: pay_channel
    value: ""
  - key: user_vip
    value: "0"
  - key: charge_time
    value: ""
  - key: pre_occupy_time
    value: ""
  - key: after_occupy_time
    value: ""
  - key: soc
    value: ""
  - key: pre_pay_amount
    value: ""
  - key: limit_strategy
    value: ""
  - key: limit_value
    value: ""
  - key: charge_post_offline_time
    value: ""
  - key: charge_post_online_time
    value: ""
  - key: raise_error_time
    value: ""

# =============================================================================
# 配置参数
# =============================================================================
config_params:
  # === 硬编码常量(不变) ===
  order_source: "0"             # 订单来源: 0=微信小程序 (WebChatMINI)
  pay_type: "1"                 # 支付方式: 1=个人卡 (CardPay)
  # === 充电数据参数(模拟器) ===
  output_voltage_max: "750"     # 输出充电电压最大值
  output_voltage_min: "200"     # 输出充电电压最小值
  output_current_max: "250"     # 输出充电电流最大值
  output_current_min: "0"      # 输出充电电流最小值
  demand_voltage_max: "750"     # 需求充电电压最大值
  demand_voltage_min: "200"     # 需求充电电压最小值
  demand_current_max: "250"     # 需求充电电流最大值
  demand_current_min: "0"      # 需求充电电流最小值
  # === 占位订单支付参数 ===
  occupy_pay_type_before: "5"   # 前占位支付方式: 5=预付
  occupy_pay_type_after: "1"    # 后占位支付方式: 1=个人卡
  occupy_pay_channel: "1"       # 占位支付通道: 1=微信
  # === 故障码停止原因 ===
  stop_reason: "20"             # 故障码: 20=电流异常
  # =================================================================
  # 概率权重配置(供generator节点的__weightedChoice使用)
  # 格式: "值1=权重1,值2=权重2" 权重自动归一化
  # =================================================================
  auto_pay_prob: "1=50,0=50"                # 自动支付: 50%概率
  force_stop_prob: "1=65,0=35"              # 强制停止充电: 65%概率
  charge_post_offline_prob: "1=95,0=5"      # 强制桩离线: 95%概率
  raise_error_prob: "1=30,0=70"             # 强制故障码: 30%概率
  force_pay_prob: "1=50,0=50"               # 强制支付: 50%概率
  pay_channel_prob: "1=70,2=30"             # 支付通道: 1=微信(70%), 2=支付宝(30%)
  user_vip_prob: "1=0,0=100"                # VIP用户: 0%概率(默认关闭)，预置数据时需要全部用户都开VIP，减少查询VIP逻辑
  safe_buy_prob: "1=50,0=50"                # 安行充: 50%概率
  # =================================================================
  # 取值范围配置(供generator节点的__random/__oneOf使用)
  # =================================================================
  charge_time_min: "300"        # 充电时长下限(秒)，这里其实是整数，单位为秒，下面几个都是
  charge_time_max: "600"       # 充电时长上限(秒)
  pre_occupy_min: "40"          # 前占位时长下限(秒)
  pre_occupy_max: "60"          # 前占位时长上限(秒)
  after_occupy_min: "60"        # 后占位时长下限(秒)
  after_occupy_max: "120"       # 后占位时长上限(秒)
  soc_min: "95"                 # SOC下限(%)
  soc_max: "100"                # SOC上限(%)
  pre_pay_min: "5"              # 预付金额下限(元)
  pre_pay_max: "999"            # 预付金额上限(元)
  limit_value_amount_ratio: "0.75"  # 按金额限制时: limitValue = prePayAmount × 此比例
  # limit_strategy: __oneOf("0","1","2") → 0=AutoFull, 1=AmountLimit, 2=SOCLimit
  # pay_channel: __weightedChoice("1=70,2=30") → 1=微信支付, 2=支付宝

# =============================================================================
# CSV 数据源
# =============================================================================
data_sources:
  # CSV 参考文件: user_charger.csv (大规模测试时可用外部CSV导入)
  # pointId(充电枪编号) 去掉后2位 = postId(充电桩编号), 如 1100000001 → postId=11000000
  # postId 在数据源中预计算(整数), 避免表达式除法产生浮点数
  - name: user_charger
    columns:
      - phone
      - pointId
      - postId
    rows:
      - phone: "15550000005"
        pointId: "1100000005"
        postId: "11000000"

# =============================================================================
# Setup: 登录 + 获取C端Token
# =============================================================================
setup:
  - name: 登录获取JWT
    type: generator
    block_on_error: true
    config:
      expression: '${__so("login","login","${salt_base_url}","${login_base_url}","${username}","${password}")}'
      variable: jwt_token

  - name: 获取C端Token
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${gatewayurl}${api_get_toc_user_token}"
      headers:
        Content-Type: application/json
      body: '{"envType":"${env_type}","phoneNo":"${user_charger.phone}","expireMinutes":1440}'
      timeout: 10000
      extract:
        token: "$.data.token"
        rsa_pri_key: "$.data.priKey"
        aes_key: "$.data.aesKey"
      expect_body:
        errorCode: 0

# =============================================================================
# 主流程节点
# =============================================================================
nodes:
  # --- 1. 连接模拟器 ---
  # postId 直接从数据源获取(已预计算为整数), 避免表达式除法产生浮点数
  - name: 计算postId
    type: generator
    config:
      expression: '${user_charger.postId}'
      variable: post_id

  - name: 计算pointIdInt
    type: generator
    config:
      expression: '${user_charger.pointId}'
      variable: point_id_int

  - name: 连接模拟器
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_cmds}"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 连接模拟器_delay
    type: delay
    config:
      ms: "3000"

  # --- 2. 空闲未插枪 (status=0) ---
  - name: 空闲未插枪
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":0}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 空闲未插枪_delay
    type: delay
    config:
      ms: "3000"

  # --- 3. 空闲已插枪 (status=11) ---
  - name: 空闲已插枪
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":11}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 空闲已插枪_delay
    type: delay
    config:
      ms: "3000"

  # --- 3-2. 获取模拟器 routePath (三段式 URL 拼接, 全局只取一次) ---
  # 模拟器接口(force-close, stop-charge-by-stop-reason, charging-process-data-param/set)
  # 采用三段式 URL 拼接: 实际URL = basePath + routePath
  # routePath 通过 getRoutePath 接口获取, 同一次测试中不会变化, 后续 while/teardown 直接复用 ${route_path}
  - name: 获取routePath-setup
    type: http
    config:
      method: POST
      url: "${simurl}/iot/simulator/shell/ev/v1/getRoutePath"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id}}'
      timeout: 10000
      extract:
        route_path: "$.data.routePath"

  # --- 4. 配置充电数据 ---
  - name: 配置充电数据
    type: http
    config:
      method: POST
      url: "${simurl}${sim_set_charge_data}${route_path}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"postId":${post_id},"outputChargingVoltageMax":${output_voltage_max},"outputChargingVoltageMin":${output_voltage_min},"outputChargingCurrentMax":${output_current_max},"outputChargingCurrentMin":${output_current_min},"demandChargingVoltageMax":${demand_voltage_max},"demandChargingVoltageMin":${demand_voltage_min},"demandChargingCurrentMax":${demand_current_max},"demandChargingCurrentMin":${demand_current_min}}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 配置充电数据_delay
    type: delay
    config:
      ms: "1000"

  # --- 5. 概率/随机/计算字段生成器 ---
  # 以下 generator 节点在运行时动态生成各字段值，替代原先的硬编码配置

  # -- 5a. 概率字段(0/1枚举值，使用__weightedChoice按权重随机) --
  - name: 生成-自动支付标志
    type: generator
    config:
      # autoPay: 1=自动支付, 0=不自动支付 (50%概率)
      expression: '${__weightedChoice("${auto_pay_prob}")}'
      variable: auto_pay

  - name: 生成-强制停止标志
    type: generator
    config:
      # forceStopCharge: 1=充电结束后再强制停一次, 0=不强制 (65%概率)
      expression: '${__weightedChoice("${force_stop_prob}")}'
      variable: force_stop_charge

  - name: 生成-桩离线标志
    type: generator
    config:
      # forceChargePostOffline: 1=模拟桩下线, 0=不下线 (95%概率)
      expression: '${__weightedChoice("${charge_post_offline_prob}")}'
      variable: charge_post_offline

  - name: 生成-故障码标志
    type: generator
    config:
      # forceRaiseError: 1=上报故障码, 0=不上报 (30%概率)
      expression: '${__weightedChoice("${raise_error_prob}")}'
      variable: raise_error

  - name: 生成-强制支付标志
    type: generator
    config:
      # forcePay: 1=强制执行支付, 0=不强制 (50%概率)
      expression: '${__weightedChoice("${force_pay_prob}")}'
      variable: force_pay

  - name: 生成-支付通道选择
    type: generator
    config:
      # payChannel: 1=微信支付(WebChatPay), 2=支付宝 (微信70%, 支付宝30%)
      expression: '${__weightedChoice("${pay_channel_prob}")}'
      variable: pay_channel

  - name: 生成-VIP用户标志
    type: generator
    config:
      # userVip: 1=VIP用户, 0=普通用户 (0%概率，默认关闭)
      # 注意: 实际 vip_use 由后续“计算VIP使用标志”节点根据VIP状态决定
      expression: '${__weightedChoice("${user_vip_prob}")}'
      variable: user_vip

  # -- 5b. 区间随机字段(使用__random在最大最小值之间随机生成) --
  - name: 生成-充电时长
    type: generator
    config:
      # chargeTime: 充电时长(秒), 范围[600, 1200]
      expression: '${__random(${charge_time_min}, ${charge_time_max})}'
      variable: charge_time

  - name: 生成-前占位时长
    type: generator
    config:
      # preOccupyTime: 充电前占位(秒), 范围[40, 60]
      expression: '${__random(${pre_occupy_min}, ${pre_occupy_max})}'
      variable: pre_occupy_time

  - name: 生成-后占位时长
    type: generator
    config:
      # afterOccupyTime: 充电后占位(秒), 范围[60, 600]
      expression: '${__random(${after_occupy_min}, ${after_occupy_max})}'
      variable: after_occupy_time

  - name: 生成-SOC
    type: generator
    config:
      # soc: 电池荷电状态(%), 范围[95, 100]
      expression: '${__random(${soc_min}, ${soc_max})}'
      variable: soc

  - name: 生成-预付金额
    type: generator
    config:
      # prePayAmount: 预付金额(元), 范围[5, 999]
      expression: '${__random(${pre_pay_min}, ${pre_pay_max})}'
      variable: pre_pay_amount

  - name: 生成-充电策略选择
    type: generator
    config:
      # limitStrategy: 充电策略枚举, 等概率随机
      # 0=AutoFull(充满即停), 1=AmountLimit(按金额限制), 2=SOCLimit(按SOC限制)
      expression: '${__oneOf("0","1","2")}'
      variable: limit_strategy

  # -- 充电策略→限额值分支计算 --
  # limitStrategy=0(AutoFull): limitValue=0(不使用)
  # limitStrategy=1(AmountLimit): limitValue=prePayAmount × 0.75
  # limitStrategy=2(SOCLimit): limitValue=soc
  - name: 判断-充电策略类型
    type: if-else
    config:
      expr: '${limit_strategy} == "0"'

  - name: 计算-充满即停限额值
    type: generator
    config:
      expression: '0'
      variable: limit_value

  - name: 判断-充电策略1或2
    type: if-else
    config:
      expr: '${limit_strategy} == "1"'

  - name: 计算-按金额限制值
    type: generator
    config:
      expression: '${pre_pay_amount} * ${limit_value_amount_ratio}'
      variable: limit_value

  - name: 计算-按SOC限制值
    type: generator
    config:
      expression: '${soc}'
      variable: limit_value

  # -- 5c. 由chargeTime数学计算得到的时间字段 --
  - name: 计算-桩预计下线时间
    type: generator
    config:
      # chargePostOfflineTime = chargeTime × 25%
      expression: '${charge_time} * 0.25'
      variable: charge_post_offline_time

  - name: 计算-桩预计上线时间
    type: generator
    config:
      # chargePostOnlineTime = chargeTime × 35%
      # 注意: 若 (onlineTime - offlineTime) > 300s, 有上限保护
      expression: '${charge_time} * 0.35'
      variable: charge_post_online_time

  - name: 计算-故障预计触发时间
    type: generator
    config:
      # raiseErrorTime = chargeTime × 55%
      expression: '${charge_time} * 0.55'
      variable: raise_error_time

  # --- 前占位 (delay) ---
  - name: 前占位
    type: delay
    config:
      ms: "${pre_occupy_time}000"

  # --- 获取签名API列表 ---
  - name: 获取签名API列表
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_get_sign_request}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{}'
      timeout: 10000
      extract:
        sign_apis_json: "$.data.signApiList"
      expect_body:
        errorCode: 0

  # --- 7. 查询待支付订单 ---
  - name: 签名-查询待支付充电订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}'
      variable: sign_result_7
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询待支付订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderClassification":[3]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        unpaid_order_id: "$.data[0].orderId"
      expect_body:
        errorCode: 0

  # --- 8. 支付待支付订单 ---
  # 判断条件：unpaid_order_id 不为 "0" 表示有订单
  # 注意：整数字段判断用 != "0"，字符串字段判断用 != ""
  - name: 判断-是否有待支付充电订单
    type: if-else
    config:
      expr: '${unpaid_order_id} != "0"'

  # 初始化 coupon_id 为数字 0，防止提取失败时变量保留旧值
  # 注意：不能用 '"0"' 或 '""' (会产生字面引号字符)，用纯数字 0
  - name: 初始化coupon_id
    type: generator
    config:
      expression: '0'
      variable: coupon_id

  - name: 查询待支付订单优惠券
    type: http
    config:
      method: POST
      url: "${baseurl}${api_user_order_coupon}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${unpaid_order_id}"}'
      timeout: 10000
      expect_body:
        errorCode: 0
      extract:
        coupon_id: "$.data.availableUserCoupon[0].instId"

  # 判断是否有可用优惠券：coupon_id 不为空表示有券
  # 与 Go 代码逻辑一致：有券时带 couponId，无券时省略该字段 (omitempty)
  - name: 判断-是否有可用优惠券
    type: if-else
    config:
      expr: '${coupon_id} != 0'

  # 分支1: 有优惠券 - 带 couponId 支付
  - name: 签名-支付待支付订单(含券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id},\"couponId\":\"${coupon_id}\"}")}'
      variable: sign_result_8
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付订单(含券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id},"couponId":"${coupon_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # 分支2: 无优惠券 - 不带 couponId 支付
  - name: 签名-支付待支付订单(无券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id}}")}'
      variable: sign_result_8b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付订单(无券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  - name: 支付待支付订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 9. 查询待支付占位订单 ---
  - name: 签名-查询待支付占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}'
      variable: sign_result_9
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询待支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"occupyOrderStatusList":[2]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        occupy_order_id: "$.data[0].chargeOccupyOrderId"
      expect_body:
        errorCode: 0

  # --- 10. 支付待支付占位订单 ---
  - name: 判断-是否有待支付占位订单
    type: if-else
    config:
      expr: '${occupy_order_id} != "0"'

  - name: 签名-支付待支付占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_before},\"payChannel\":${occupy_pay_channel}}")}'
      variable: sign_result_10
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付待支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_before},"payChannel":${occupy_pay_channel}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  - name: 支付待支付占位订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 11. 获取AccountID (POST startChargingInfo) ---
  - name: 签名-获取账户ID
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"pointId\":\"${user_charger.pointId}\"}")}'
      variable: sign_result_11
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取AccountID
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_start_charging_info}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"pointId":"${user_charger.pointId}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        account_id: "$.data.accountInfoRsp.accountId"
        tenant_id: "$.data.tenantId"
        station_id: "$.data.mgrStationRsp.stationId"
      expect_body:
        errorCode: 0

  # --- 12. 获取UserId ---
  - name: 签名-获取用户ID
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_12
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取UserId
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_get_user_id}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        user_id: "$.data.userId"
      expect_body:
        errorCode: 0

  # --- 13. 获取VIP状态 ---
  - name: 签名-获取VIP状态
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"accountId\":\"${account_id}\",\"tenantId\":\"${tenant_id}\"}")}'
      variable: sign_result_13
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取VIP状态
    type: http
    config:
      method: POST
      url: "${baseurl}${api_get_vip_info}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"accountId":"${account_id}","tenantId":"${tenant_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        vip_status: "$.data.userVipDetailRspVO.userVipStatus"
        today_left_count: "$.data.userVipDetailRspVO.userVipPackageCycleInfo.toDayLeftCount"
      expect_body:
        errorCode: 0

  # vip_use 使用__weightedChoice按概率生成 (默认0%概率，即始终为0)
  # 精确逻辑: (user_vip==1 && vip_status==1 && today_left_count>0) ? 1 : 0
  # 当前简化: 直接使用概率配置决定
  - name: 计算VIP使用标志
    type: generator
    config:
      # vip_use: 1=使用VIP权益, 0=不使用 (默认0%概率)
      expression: '${__weightedChoice("${user_vip_prob}")}'
      variable: vip_use

  # --- 14. 查询券包活动 ---
  - name: 签名-查询券包活动
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"pointId\":\"${user_charger.pointId}\",\"activityNeed\":[3]}")}'
      variable: sign_result_14
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询券包活动
    type: http
    config:
      method: POST
      url: "${baseurl}${api_query_activity}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"pointId":"${user_charger.pointId}","activityNeed":[3]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # --- 15. 查询安行充 ---
  - name: 签名-查询安行充配置
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"stationId\":\"${station_id}\"}")}'
      variable: sign_result_15
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询安行充
    type: http
    config:
      method: POST
      url: "${baseurl}${api_safe_config}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"stationId":"${station_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        sell_flag: "$.data.SellFlag"
      expect_body:
        errorCode: 0

  - name: 计算安行充标志
    type: generator
    config:
      # sellBuyFlag: 1=购买安行充, 0=不购买 (50%概率)
      expression: '${__weightedChoice("${safe_buy_prob}")}'
      variable: sell_buy_flag

  # --- 16. 生成支付密码 ---
  - name: 生成支付密码
    type: generator
    block_on_error: true
    config:
      expression: '${__so("paypwd","gen","${baseurl}","${token}","${aes_key}","${user_id}","123456")}'
      variable: password_enc

  # --- 17. 创建订单 ---
  - name: 构造创建订单body
    type: generator
    config:
      expression: '{"chargingPointId":"${user_charger.pointId}","autoPay":${auto_pay},"orderSource":${order_source},"limitStrategy":${limit_strategy},"limitValue":${limit_value},"soc":${soc},"prePayAmount":${pre_pay_amount},"payType":${pay_type},"payChannel":${pay_channel},"passWord":"${password_enc}","orderChargeType":1,"useVipInterest":${vip_use},"safeBuyFlag":${sell_buy_flag}}'
      variable: create_order_body

  - name: 签名-创建充电订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","${create_order_body}")}'
      variable: sign_result_17
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 创建订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_create_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '${create_order_body}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密（默认 aes_mode=1，无需显式指定）
      expect_body:
        errorCode: 0
      extract:
        order_id: "$.data.orderId"

  - name: 创建订单_delay
    type: delay
    config:
      ms: "3000"

  - name: 记录充电开始时间
    type: generator
    config:
      expression: '${__so("sign","now_ms")}'
      variable: charge_start_time_ms

  # --- 18. 轮询充电状态 (30s间隔, status==6退出) ---
  # 注意: while 步骤使用 Salvo step 语法(request/condition/timed_trigger)
  # 查询充电状态使用 sign_post SO 插件(签名+HTTP一体化)
  # 桩离线/上线使用 condition + timed_trigger
  - name: 轮询充电状态
    type: while
    block_on_error: true
    config:
      exit_conditions:
        - variable: charging_status
          operator: equals
          value: "6"
      interval_seconds: 30
      max_iterations: 200
      steps:
        # 18a. 查询充电状态 (拆分为签名+HTTP两步, sign_post 插件存在 body 双重转义问题)
        - name: 签名-查询充电状态
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
            variable: sign_result_charge_status
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 查询充电状态
          request:
            method: POST
            url: "${baseurl}${api_charging_data}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"orderId":${order_id}}'
          aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
          extract:
            - variable: charging_status
              path: "$.data.chargingStatus"

        # 18b. 桩离线 (条件: charge_post_offline==1, 延迟触发, 仅执行一次)
        # URL 中的 ${route_path} 在主流程 获取routePath-setup 中已获取, 此处直接复用
        - name: 桩离线
          condition:
            variable: charge_post_offline
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${charge_post_offline_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_force_close}${route_path}"
            headers:
              Content-Type: application/json
            body: '{"postId":${post_id}}'

        # 18c. 桩上线 (条件: charge_post_offline==1, 延迟触发)
        - name: 桩上线
          condition:
            variable: charge_post_offline
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${charge_post_online_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_cmds}"
            headers:
              Content-Type: application/json
            body: '{"postId":${post_id},"cmds":[{"cmd":"connect","body":"{\"ip\":\"${sim_connect_ip}\",\"port\":${sim_port},\"debugMode\":false,\"reconnect\":false}"}]}'

        # 18d. 故障码上报停止充电 (条件: raise_error==1, 延迟触发)
        - name: 故障码停止
          condition:
            variable: raise_error
            operator: equals
            value: "1"
          timed_trigger:
            after_seconds: "${raise_error_time}"
            once: true
          request:
            method: POST
            url: "${simurl}${sim_stop_charge_reason}${route_path}"
            headers:
              Content-Type: application/json
            body: '{"pointId":${point_id_int},"postId":${post_id},"stopReason":${stop_reason}}'

        # 18e. 检查充电时长是否到达
        - name: 检查充电时长
          type: generator
          config:
            expression: '${__so("sign","check_charge_time","${charge_start_time_ms}","${charge_time}")}'
            variable: charge_time_reached

        # 18f. 停止充电 (条件: charge_time_reached=="true")
        # 拆分为签名+HTTP两步, sign_post 插件存在 body 双重转义问题
        - name: 签名-停止充电
          condition:
            variable: charge_time_reached
            operator: equals
            value: "true"
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
            variable: sign_result_stop
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 停止充电
          condition:
            variable: charge_time_reached
            operator: equals
            value: "true"
          request:
            method: POST
            url: "${baseurl}${api_stop_charge}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"orderId":${order_id}}'
          aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
          retry:
            max_attempts: 10
            on_429: retry

  # --- 19. 强制停止充电 ---
  # Go代码: ForceStopChargeStep → StopCharge() → DoPostSign (与正常停止充电使用同一个接口和签名方式)
  # 拆分为签名+HTTP两步, sign_post 插件存在 body 双重转义问题
  - name: 判断-是否强制停止充电
    type: if-else
    config:
      expr: '${force_stop_charge} == "1"'

  - name: 签名-强制停止充电
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_force_stop
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 强制停止充电
    type: http
    config:
      method: POST
      url: "${baseurl}${api_stop_charge}"
      headers:
        Authorization: "${token}"
        Content-Type: application/json
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
    retry:
      max_attempts: 10
      on_429: retry

  # --- 20. 查询充电曲线 (5%概率) ---
  - name: 判断-是否查询充电曲线
    type: if-else
    config:
      expr: '${__random(1, 20)} == 1'

  - name: 签名-查询充电曲线
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_20
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询充电曲线
    type: http
    config:
      method: POST
      url: "${baseurl}${api_charging_curve}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # --- 21. 查询未支付订单(充电后) ---
  - name: 签名-查询未支付充电订单(后)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderClassification\":[3]}")}'
      variable: sign_result_21
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 查询未支付订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_query_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderClassification":[3]}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        unpaid_order_id_after: "$.data[0].orderId"
      expect_body:
        errorCode: 0

  # --- 22. 支付未支付订单(含优惠券) ---
  - name: 判断-是否有未支付充电订单
    type: if-else
    config:
      expr: '${unpaid_order_id_after} != ""'

  # 初始化 coupon_id_after 为数字 0
  - name: 初始化coupon_id_after
    type: generator
    config:
      expression: '0'
      variable: coupon_id_after

  - name: 查询未付订单优惠券
    type: http
    config:
      method: POST
      url: "${baseurl}${api_user_order_coupon}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"orderId":"${unpaid_order_id_after}"}'
      timeout: 10000
      extract:
        coupon_id_after: "$.data.availableUserCoupon[0].instId"
      expect_body:
        errorCode: 0

  # 判断是否有可用优惠券
  - name: 判断-是否有可用优惠券(后)
    type: if-else
    config:
      expr: '${coupon_id_after} != 0'

  # 有券分支
  - name: 签名-支付未支付订单(含券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after},\"couponId\":\"${coupon_id_after}\"}")}'
      variable: sign_result_22
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付未支付订单(含券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id_after},"couponId":"${coupon_id_after}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # 无券分支
  - name: 签名-支付未支付订单(无券)
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${unpaid_order_id_after}}")}'
      variable: sign_result_22b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付未支付订单(无券)
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${unpaid_order_id_after}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  - name: 支付未支付订单_delay
    type: delay
    config:
      ms: "3000"

  # --- 23. 强制支付 ---
  - name: 判断-是否强制支付
    type: if-else
    config:
      expr: '${force_pay} == "1"'

  - name: 签名-强制支付订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":${order_id}}")}'
      variable: sign_result_23
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 强制支付
    type: http
    config:
      method: POST
      url: "${baseurl}${api_pay_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":${order_id}}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # --- 24. 检查订单是否已支付 ---
  - name: 签名-检查订单支付状态
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"orderId\":\"${order_id}\"}")}'
      variable: sign_result_24
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 检查订单已支付
    type: http
    config:
      method: POST
      url: "${baseurl}${api_order_detail}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"orderId":"${order_id}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        pay_status: "$.data.payStatus"
      expect_body:
        errorCode: 0

  # --- 25. 评论 (条件: payStatus==1) ---
  - name: 判断-订单是否已支付可评论
    type: if-else
    config:
      expr: '${pay_status} == 1'

  - name: 签名-生成文件上传Token
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_25a
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 生成文件上传token
    type: http
    config:
      method: POST
      url: "${gatewayurl}${api_gen_token}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
      body: '{"userId":${user_id},"tenantId":${tenant_id}}'
      timeout: 10000
      extract:
        upload_token: "$.data"
      expect_body:
        errorCode: 0

  - name: 上传评论图片
    type: http
    config:
      method: POST
      url: "${gatewayurl}${api_upload_file}"
      headers:
        Authorization: "${token}"
      multipart:
        token: "${upload_token}"
        file: "asserts/comments.jpg"
      timeout: 10000
      extract:
        img_path: "$.data.filePath"
      expect_body:
        errorCode: 0

  - name: 签名-获取评论标签和星级
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{}")}'
      variable: sign_result_25b
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 获取评论标签
    type: http
    config:
      method: POST
      url: "${baseurl}${api_get_tag}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      extract:
        comment_star: "$.data[0].star"
        comment_tag_id: "$.data[0].tagId"
      expect_body:
        errorCode: 0

  - name: 构造评论body
    type: generator
    config:
      expression: '{"content":"用户:${user_charger.phone}, 订单号:${order_id}","imgList":["${img_path}"],"isAnonymous":0,"orderId":"${order_id}","orderUserId":"${user_id}","sourceType":2,"startLevel":${comment_star},"tagIdList":["${comment_tag_id}"]}'
      variable: comment_body

  - name: 签名-构造评论数据
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","${comment_body}")}'
      variable: sign_result_25c
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 保存评论
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_save_comment}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '${comment_body}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  # --- 26. 后占位 (delay) ---
  - name: 后占位
    type: delay
    config:
      ms: "${after_occupy_time}000"

  # --- 27. 重置枪状态 (空闲未插枪 status=0) ---
  - name: 重置枪状态
    type: http
    config:
      method: POST
      url: "${simurl}${sim_update_point_status}"
      headers:
        Content-Type: application/json
      body: '{"pointId":${point_id_int},"status":0}'
      timeout: 10000
      expect_body:
        errorCode: 0

  - name: 重置枪状态_delay
    type: delay
    config:
      ms: "3000"

  # --- 28. 轮询占位订单 (30s间隔, 5分钟超时=10次) ---
  - name: 重置占位订单ID
    type: generator
    config:
      expression: '0'
      variable: occupy_order_id

  - name: 轮询占位订单
    type: while
    block_on_error: true
    config:
      exit_conditions:
        - variable: occupy_order_id
          operator: not_equals
          value: "0"
      interval_seconds: 30
      max_iterations: 10
      steps:
        - name: 签名-查询占位订单
          type: generator
          config:
            expression: '${__so("sign","sign","${rsa_pri_key}","{\"occupyOrderStatusList\":[2]}")}'
            variable: sign_result_occupy
            extract:
              api_sign: "$.sign"
              api_ts: "$.ts"

        - name: 查询占位订单
          request:
            method: POST
            url: "${baseurl}${api_query_occupy_order}"
            headers:
              Authorization: "${token}"
              Content-Type: application/json
              x-ev-api-sign: "${api_sign}"
              x-ev-api-timestamp: "${api_ts}"
            body: '{"occupyOrderStatusList":[2]}'
          aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
          extract:
            - variable: occupy_order_id
              path: "$.data[0].chargeOccupyOrderId"

  # --- 29. 支付占位订单 ---
  - name: 判断-是否有未支付占位订单
    type: if-else
    config:
      expr: '${occupy_order_id} != "0"'

  - name: 签名-支付充电后占位订单
    type: generator
    config:
      expression: '${__so("sign","sign","${rsa_pri_key}","{\"chargeOccupyOrderId\":\"${occupy_order_id}\",\"payType\":${occupy_pay_type_after},\"payChannel\":${occupy_pay_channel},\"passWord\":\"${password_enc}\"}")}'
      variable: sign_result_29
      extract:
        api_sign: "$.sign"
        api_ts: "$.ts"

  - name: 支付占位订单
    type: http
    block_on_error: true
    config:
      method: POST
      url: "${baseurl}${api_pay_occupy_order}"
      headers:
        Content-Type: application/json
        Authorization: "${token}"
        x-ev-api-sign: "${api_sign}"
        x-ev-api-timestamp: "${api_ts}"
      body: '{"chargeOccupyOrderId":"${occupy_order_id}","payType":${occupy_pay_type_after},"payChannel":${occupy_pay_channel},"passWord":"${password_enc}"}'
      timeout: 10000
      aes_decrypt: "${aes_key}"   # Manhattan 响应 AES-GCM 解密
      expect_body:
        errorCode: 0

  - name: 支付占位订单_delay
    type: delay
    config:
      ms: "3000"

# =============================================================================
# Teardown: 断开模拟器连接
# =============================================================================
teardown:
  # routePath 复用主流程 获取routePath-setup 中已提取的 ${route_path}
  - name: 断开模拟器
    type: http
    config:
      method: POST
      url: "${simurl}${sim_force_close}${route_path}"
      headers:
        Content-Type: application/json
      body: '{"postId":${post_id}}'
      timeout: 10000
      expect_body:
        errorCode: 0

# =============================================================================
# DAG 边定义
# =============================================================================
edges:
  # Setup → Nodes
  - from: 获取C端Token
    to: 计算postId

  # 模拟器连接 + 状态设置
  - from: 计算postId
    to: 计算pointIdInt
  - from: 计算pointIdInt
    to: 连接模拟器
  - from: 连接模拟器
    to: 连接模拟器_delay
  - from: 连接模拟器_delay
    to: 空闲未插枪
  - from: 空闲未插枪
    to: 空闲未插枪_delay
  - from: 空闲未插枪_delay
    to: 空闲已插枪
  - from: 空闲已插枪
    to: 空闲已插枪_delay
  - from: 空闲已插枪_delay
    to: 获取routePath-setup
  - from: 获取routePath-setup
    to: 配置充电数据
  - from: 配置充电数据
    to: 配置充电数据_delay
  - from: 配置充电数据_delay
    to: 生成-自动支付标志
  # 概率字段生成器链路
  - from: 生成-自动支付标志
    to: 生成-强制停止标志
  - from: 生成-强制停止标志
    to: 生成-桩离线标志
  - from: 生成-桩离线标志
    to: 生成-故障码标志
  - from: 生成-故障码标志
    to: 生成-强制支付标志
  - from: 生成-强制支付标志
    to: 生成-支付通道选择
  - from: 生成-支付通道选择
    to: 生成-VIP用户标志
  - from: 生成-VIP用户标志
    to: 生成-充电时长
  - from: 生成-充电时长
    to: 生成-前占位时长
  - from: 生成-前占位时长
    to: 生成-后占位时长
  - from: 生成-后占位时长
    to: 生成-SOC
  - from: 生成-SOC
    to: 生成-预付金额
  - from: 生成-预付金额
    to: 生成-充电策略选择
  # 充电策略→限额值三分支
  - from: 生成-充电策略选择
    to: 判断-充电策略类型
  # 分支1: strategy==0 (AutoFull)
  - from: 判断-充电策略类型
    to: 计算-充满即停限额值
    condition: "__if_true__"
  # 分支2+3: strategy!=0, 继续判断1或2
  - from: 判断-充电策略类型
    to: 判断-充电策略1或2
    condition: "__if_false__"
  # 分支2: strategy==1 (AmountLimit)
  - from: 判断-充电策略1或2
    to: 计算-按金额限制值
    condition: "__if_true__"
  # 分支3: strategy==2 (SOCLimit)
  - from: 判断-充电策略1或2
    to: 计算-按SOC限制值
    condition: "__if_false__"
  # 三路汇合
  - from: 计算-充满即停限额值
    to: 计算-桩预计下线时间
  - from: 计算-按金额限制值
    to: 计算-桩预计下线时间
  - from: 计算-按SOC限制值
    to: 计算-桩预计下线时间
  # 计算字段链路(依赖charge_time)
  - from: 计算-桩预计下线时间
    to: 计算-桩预计上线时间
  - from: 计算-桩预计上线时间
    to: 计算-故障预计触发时间
  - from: 计算-故障预计触发时间
    to: 前占位

  # 前占位 → 签名API列表
  - from: 前占位
    to: 获取签名API列表

  # 查询+支付待支付订单
  - from: 获取签名API列表
    to: 签名-查询待支付充电订单
  - from: 签名-查询待支付充电订单
    to: 查询待支付订单
  - from: 查询待支付订单
    to: 判断-是否有待支付充电订单
  - from: 判断-是否有待支付充电订单
    to: 初始化coupon_id
    condition: "__if_true__"
  - from: 初始化coupon_id
    to: 查询待支付订单优惠券
  - from: 判断-是否有待支付充电订单
    to: 签名-查询待支付占位订单
    condition: "__if_false__"
  - from: 查询待支付订单优惠券
    to: 判断-是否有可用优惠券
  # 有券分支
  - from: 判断-是否有可用优惠券
    to: 签名-支付待支付订单(含券)
    condition: "__if_true__"
  - from: 签名-支付待支付订单(含券)
    to: 支付待支付订单(含券)
  - from: 支付待支付订单(含券)
    to: 支付待支付订单_delay
  # 无券分支
  - from: 判断-是否有可用优惠券
    to: 签名-支付待支付订单(无券)
    condition: "__if_false__"
  - from: 签名-支付待支付订单(无券)
    to: 支付待支付订单(无券)
  - from: 支付待支付订单(无券)
    to: 支付待支付订单_delay
  - from: 支付待支付订单_delay
    to: 签名-查询待支付占位订单

  # 查询+支付待支付占位订单
  - from: 签名-查询待支付占位订单
    to: 查询待支付占位订单
  - from: 查询待支付占位订单
    to: 判断-是否有待支付占位订单
  - from: 判断-是否有待支付占位订单
    to: 签名-支付待支付占位订单
    condition: "__if_true__"
  - from: 判断-是否有待支付占位订单
    to: 签名-获取账户ID
    condition: "__if_false__"
  - from: 签名-支付待支付占位订单
    to: 支付待支付占位订单
  - from: 支付待支付占位订单
    to: 支付待支付占位订单_delay
  - from: 支付待支付占位订单_delay
    to: 签名-获取账户ID

  # 获取账户信息
  - from: 签名-获取账户ID
    to: 获取AccountID
  - from: 获取AccountID
    to: 签名-获取用户ID
  - from: 签名-获取用户ID
    to: 获取UserId
  - from: 获取UserId
    to: 签名-获取VIP状态
  - from: 签名-获取VIP状态
    to: 获取VIP状态
  - from: 获取VIP状态
    to: 计算VIP使用标志
  - from: 计算VIP使用标志
    to: 签名-查询券包活动

  # 查询券包 + 安行充
  - from: 签名-查询券包活动
    to: 查询券包活动
  - from: 查询券包活动
    to: 签名-查询安行充配置
  - from: 签名-查询安行充配置
    to: 查询安行充
  - from: 查询安行充
    to: 计算安行充标志

  # 生成密码 + 创建订单
  - from: 计算安行充标志
    to: 生成支付密码
  - from: 生成支付密码
    to: 构造创建订单body
  - from: 构造创建订单body
    to: 签名-创建充电订单
  - from: 签名-创建充电订单
    to: 创建订单
  - from: 创建订单
    to: 创建订单_delay
  - from: 创建订单_delay
    to: 记录充电开始时间
  - from: 记录充电开始时间
    to: 轮询充电状态

  # 轮询后 → 强制停止 + 曲线
  - from: 轮询充电状态
    to: 判断-是否强制停止充电
  - from: 判断-是否强制停止充电
    to: 签名-强制停止充电
    condition: "__if_true__"
  - from: 签名-强制停止充电
    to: 强制停止充电
  - from: 判断-是否强制停止充电
    to: 判断-是否查询充电曲线
    condition: "__if_false__"
  - from: 强制停止充电
    to: 判断-是否查询充电曲线

  # 充电曲线
  - from: 判断-是否查询充电曲线
    to: 签名-查询充电曲线
    condition: "__if_true__"
  - from: 判断-是否查询充电曲线
    to: 签名-查询未支付充电订单(后)
    condition: "__if_false__"
  - from: 签名-查询充电曲线
    to: 查询充电曲线
  - from: 查询充电曲线
    to: 签名-查询未支付充电订单(后)

  # 查询+支付未支付订单(充电后)
  - from: 签名-查询未支付充电订单(后)
    to: 查询未支付订单
  - from: 查询未支付订单
    to: 判断-是否有未支付充电订单
  - from: 判断-是否有未支付充电订单
    to: 初始化coupon_id_after
    condition: "__if_true__"
  - from: 初始化coupon_id_after
    to: 查询未付订单优惠券
  - from: 判断-是否有未支付充电订单
    to: 判断-是否强制支付
    condition: "__if_false__"
  - from: 查询未付订单优惠券
    to: 判断-是否有可用优惠券(后)
  # 有券分支
  - from: 判断-是否有可用优惠券(后)
    to: 签名-支付未支付订单(含券)
    condition: "__if_true__"
  - from: 签名-支付未支付订单(含券)
    to: 支付未支付订单(含券)
  - from: 支付未支付订单(含券)
    to: 支付未支付订单_delay
  # 无券分支
  - from: 判断-是否有可用优惠券(后)
    to: 签名-支付未支付订单(无券)
    condition: "__if_false__"
  - from: 签名-支付未支付订单(无券)
    to: 支付未支付订单(无券)
  - from: 支付未支付订单(无券)
    to: 支付未支付订单_delay
